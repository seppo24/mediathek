<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c2410c">
<title>Mediathek</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Monoton&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f2ea; --surface:#fffdf8; --surface2:#efe8db; --ink:#1f1b16; --ink2:#6b6257; --line:#e2d9c8;
  --accent:#c2410c; --accent-ink:#fff; --ok:#15803d; --bad:#b91c1c; --warn:#a16207;
  --t-bluray:#1d4ed8; --t-buch:#a16207; --t-game:#7c3aed; --t-brettspiel:#047857; --t-vinyl:#db2777;
  --radius:14px; --shadow:0 1px 2px rgba(40,30,10,.06),0 6px 18px rgba(40,30,10,.07);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#15130f; --surface:#1f1c17; --surface2:#2a261f; --ink:#f3ede2; --ink2:#a89f92; --line:#3a342b;
    --accent:#f97316; --accent-ink:#1b0d03; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
    --t-bluray:#60a5fa; --t-buch:#fbbf24; --t-game:#a78bfa; --t-brettspiel:#34d399; --t-vinyl:#f472b6; color-scheme: dark; }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1160px;margin:0 auto;padding:0 16px}
header.app{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 0 8px}
.brand{font:800 22px/1 Fraunces,Georgia,serif;letter-spacing:-.01em;flex:1;display:flex;align-items:center;gap:8px}
.brand small{font:500 12px system-ui;color:var(--ink2)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:38px;min-width:38px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.iconbtn svg{width:18px;height:18px}
.sync{font-size:12px;color:var(--ink2)}
.sync .dot{width:8px;height:8px;border-radius:50%;background:#9ca3af;display:inline-block}
.sync.ok .dot{background:var(--ok)} .sync.busy .dot{background:var(--warn);animation:pulse 1s infinite} .sync.err .dot{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center}
.chip .n{font-weight:500;color:var(--ink2);font-size:12px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed=true] .n{color:inherit;opacity:.7}
.toolbar{display:flex;gap:8px;align-items:center;padding-bottom:10px;flex-wrap:wrap}
.search{flex:1 1 200px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:40px}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;height:100%}
.select{height:40px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 10px}
.btn{height:40px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:11px;padding:1px 6px}
.switch{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;user-select:none;cursor:pointer;height:40px;padding:0 4px}
.switch input{appearance:none;width:42px;height:24px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);position:relative;transition:.2s;margin:0;cursor:pointer}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.switch input:checked{background:var(--accent);border-color:var(--accent)}
.switch input:checked::after{left:20px}
.activefilters{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:10px}
.af{font-size:12px;background:var(--surface2);border-radius:999px;padding:4px 6px 4px 10px;display:inline-flex;gap:4px;align-items:center;border:0}
.af b{font-weight:600}
main{padding:14px 0 120px}
.empty{text-align:center;color:var(--ink2);padding:60px 20px}
.empty .big{font:800 26px Fraunces,serif;color:var(--ink);margin-bottom:6px}
/* Liste */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.row{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px;box-shadow:var(--shadow);width:100%}
.thumb{width:52px;height:68px;border-radius:6px;flex:none;overflow:hidden;background:var(--surface2);display:grid;place-items:center;font:800 15px Fraunces,serif;color:#fff;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ri{min-width:0;flex:1}
.rt{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb{display:flex;gap:6px;align-items:center;margin-top:4px;flex-wrap:wrap}
.tb{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;color:#fff}
.tb.bluray{background:var(--t-bluray)} .tb.buch{background:var(--t-buch)} .tb.game{background:var(--t-game)} .tb.brettspiel{background:var(--t-brettspiel)} .tb.vinyl{background:var(--t-vinyl)}
@media (prefers-color-scheme: dark){.tb{color:#111}}
.lent{font-size:11px;font-weight:600;color:var(--bad);border:1px solid currentColor;border-radius:999px;padding:1px 7px}
.stars-s{color:#f59e0b;font-size:12px;letter-spacing:1px}
/* FAB */
.fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));z-index:30;width:60px;height:60px;border-radius:20px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 10px 24px rgba(194,65,12,.45);display:grid;place-items:center}
.fab svg{width:28px;height:28px}
/* Sheets */
.overlay{position:fixed;inset:0;background:rgba(15,10,5,.45);display:flex;align-items:flex-end;justify-content:center;z-index:100;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:6px 18px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out;position:relative}
@media (min-width:760px){.overlay{align-items:center}.sheet{border-radius:22px;max-height:88vh}}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.sheet.full{max-width:none;height:100%;max-height:none;border-radius:0}
.sheet-head{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0 10px;z-index:2;border-bottom:1px solid var(--line);margin-bottom:12px}
.sheet-head h2{flex:1;margin:0;font:800 20px Fraunces,Georgia,serif}
.grip{width:40px;height:4px;border-radius:9px;background:var(--line);margin:6px auto 0}
.menu{display:grid;gap:10px;padding-bottom:6px}
.menu button{display:flex;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.menu .mi{font-size:26px;width:40px;text-align:center}
.menu b{display:block}
.menu small{color:var(--ink2)}
.menu button:disabled{opacity:.5}
/* Formular */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.form{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2);font-weight:600}
.fld.wide{grid-column:1/-1}
.fld input,.fld select,.fld textarea{font-size:15px;font-weight:400;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.fld.err input,.fld.err select{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.inrow{display:flex;gap:6px}
.inrow input{flex:1}
.inrow .btn{height:44px;flex:none}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 8px;font-weight:600;font-size:14px;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--surface);box-shadow:var(--shadow)}
.starsin{display:flex;gap:2px}
.starsin button{border:0;background:none;font-size:26px;line-height:1;color:var(--line);padding:4px 2px}
.starsin button.on{color:#f59e0b}
.coverbox{grid-column:1/-1;display:flex;gap:14px;align-items:center}
.coverbox .thumb{width:84px;height:110px}
.coverbox .acts{display:flex;gap:8px;flex-wrap:wrap}
.formfoot{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom));background:var(--bg);padding:14px 0 calc(16px + env(safe-area-inset-bottom));margin-top:16px;display:flex;gap:10px;border-top:1px solid var(--line)}
.formfoot .btn{flex:1;height:48px}
.hint{font-size:13px;color:var(--ink2)}
.note{background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:13px}
.note.warn{background:color-mix(in srgb,var(--warn) 15%,var(--surface));color:var(--ink)}
/* Detail */
.detail-top{display:flex;gap:16px;margin-bottom:14px}
.detail-top .thumb{width:110px;height:146px;font-size:28px}
.detail-top h3{margin:0 0 4px;font:800 22px/1.15 Fraunces,Georgia,serif}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 10px;font-size:14px}
dl.facts dt{color:var(--ink2)}
dl.facts dd{margin:0;font-weight:500;word-break:break-word}
/* Einstellungen */
.set h3{font:800 17px Fraunces,Georgia,serif;margin:22px 0 8px}
.set .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;gap:12px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.opt input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px}
.opt > span > b:first-child{display:block}
.opt small{color:var(--ink2);display:block}
.opt:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.reqgrid{display:flex;flex-wrap:wrap;gap:6px}
.reqgrid label{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:5px 10px;display:flex;gap:6px;align-items:center;cursor:pointer}
.reqgrid label:has(input:checked){background:var(--ink);color:var(--bg);border-color:var(--ink)}
.reqgrid input{display:none}
/* Review */
.rv-progress{height:6px;border-radius:9px;background:var(--surface2);overflow:hidden;margin-bottom:14px}
.rv-progress div{height:100%;background:var(--accent);transition:width .3s}
.rv-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.rv-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.rv-actions .btn{height:52px;font-size:16px}
.rv-actions .yes{grid-column:1/-1}
.conf{font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px}
.conf.hoch{background:#dcfce7;color:#166534}.conf.mittel{background:#fef9c3;color:#854d0e}.conf.niedrig{background:#fee2e2;color:#991b1b}
.lendbox{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);gap:8px}
.lendbox.on{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 5%,var(--surface))}
.lendrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.lendrow{grid-template-columns:1fr}}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer;min-height:36px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.hist{margin:0 0 10px;font-size:14px}.hist summary{cursor:pointer;color:var(--ink2);font-weight:600}.hist ul{margin:6px 0 0;padding-left:18px}
.wish{font-size:11px;font-weight:600;color:#a16207;border:1px solid currentColor;border-radius:999px;padding:1px 7px}
@media (prefers-color-scheme: dark){.wish{color:#fbbf24}}
.wishchk{margin:0 0 12px;font-size:14px;padding:8px 12px;border:1px dashed var(--line);border-radius:12px}
.wishchk:has(input:checked){border-color:#a16207;border-style:solid;background:color-mix(in srgb,#f59e0b 10%,var(--surface))}
.spine.img{background-size:auto,100% 100%;background-color:#3d2614}
.spine.img .st,.spine.img .sa{visibility:hidden}
.spine.img.hc::before,.spine.img.hc::after{display:none}
@media (max-width:440px){.brand small{display:none}.topbar{gap:6px}.iconbtn{padding:0 9px}}
body.view #fab,body.view #settingsBtn,body.view #syncBtn,body.view #checkBtn{display:none}
.viewbar{background:var(--ink);color:var(--bg);font-size:13px;text-align:center;padding:6px 12px}
/* Schnellcheck */
.verdict{border-radius:18px;padding:16px;margin-top:12px;display:flex;gap:14px;align-items:center}
.verdict .big{font:800 20px/1.15 Fraunces,Georgia,serif}
.verdict.yes{background:color-mix(in srgb,var(--ok) 14%,var(--surface));border:2px solid var(--ok)}
.verdict.no{background:color-mix(in srgb,var(--bad) 10%,var(--surface));border:2px solid var(--bad)}
.verdict.maybe,.verdict.wish{background:color-mix(in srgb,#f59e0b 14%,var(--surface));border:2px solid #d97706}
.verdict .ic{font-size:34px;line-height:1;flex:none}
.verdict .thumb{width:56px;height:74px}
.chkacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chkacts .btn{flex:1}
.hits{display:grid;gap:8px;margin-top:10px}
/* Statistik */
:root{--c-bluray:#1d4ed8;--c-buch:#a16207;--c-game:#7c3aed;--c-brettspiel:#047857;--c-vinyl:#db2777}
@media (prefers-color-scheme: dark){:root{--c-bluray:#3b82f6;--c-buch:#d97706;--c-game:#8b5cf6;--c-brettspiel:#059669;--c-vinyl:#ec4899}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile .v{font:800 28px/1.1 Fraunces,Georgia,serif;font-variant-numeric:tabular-nums}
.tile .l{font-size:13px;color:var(--ink2);margin-top:2px}
.stsec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.stsec h4{margin:0 0 10px;font:700 15px system-ui}
.stsec .sub{font-size:12px;color:var(--ink2);margin:-6px 0 10px}
.bars{display:grid;grid-template-columns:minmax(80px,max-content) 1fr max-content;gap:6px 10px;align-items:center;font-size:13px}
.bars .lb{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.bars .tr{height:14px;background:var(--surface2);border-radius:0 4px 4px 0;overflow:hidden}
.bars .fl{height:100%;border-radius:0 4px 4px 0;background:var(--accent);min-width:2px}
.bars .vl{color:var(--ink2);font-variant-numeric:tabular-nums;text-align:right}
.bars button.lb{border:0;background:none;padding:0;text-align:left;text-decoration:underline dotted;text-underline-offset:3px}
.cols{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:1px solid var(--line);padding-top:16px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.cols .c .b{width:100%;max-width:26px;background:var(--accent);border-radius:4px 4px 0 0;min-height:0}
.cols .c .n{font-size:10px;color:var(--ink2);position:absolute;font-variant-numeric:tabular-nums}
.colx{display:flex;gap:2px;font-size:10px;color:var(--ink2);margin-top:4px}
.colx span{flex:1;text-align:center}
.meter{display:grid;grid-template-columns:minmax(90px,max-content) 1fr max-content;gap:8px 10px;align-items:center;font-size:13px}
.meter .tr{height:10px;background:var(--surface2);border-radius:999px;overflow:hidden}
.meter .fl{height:100%;border-radius:999px}
.stgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 12px}
.planhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
.planhead h2{margin:0;font:800 22px Fraunces,Georgia,serif}
.pcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.pcard h3{margin:0;font:800 18px Fraunces,Georgia,serif}
.pcard .meta{font-size:13px;color:var(--ink2);margin:2px 0 8px}
.podium{display:flex;gap:6px;flex-wrap:wrap}
.podium span{font-size:13px;background:var(--surface2);border-radius:999px;padding:3px 10px}
.rankrow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rankrow .pos{font:800 20px Fraunces,serif;text-align:center}
.rankrow .tr{height:8px;background:var(--surface2);border-radius:0 4px 4px 0;margin-top:5px}
.rankrow .fl{height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.rankrow .pts{font-variant-numeric:tabular-nums;font-weight:700}
.medals{font-size:12px;color:var(--ink2)}
.votelist{display:grid;gap:6px;font-size:14px}
.votelist div{display:flex;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.pick{display:flex;gap:6px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--line)}
.pick .pl{display:flex;gap:10px;align-items:center;flex:1;min-width:0;cursor:pointer;padding:2px 0}
.pick.istip{background:color-mix(in srgb,#facc15 12%,transparent)}
.tipbtn{border:0;background:none;font-size:26px;line-height:1;color:var(--ink2);width:44px;height:44px;flex:none;border-radius:50%}
.tipbtn.on{color:#eab308}
.tipb{position:absolute;top:8px;right:8px;background:#facc15;color:#111;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;z-index:1;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tipb.inl{position:static;display:inline-block;vertical-align:middle;box-shadow:none;margin-left:4px}
.vcard.tip{border-color:#facc15}
.vsec{grid-column:1/-1;margin:6px 0 -2px;font:800 17px Fraunces,Georgia,serif}
.pick input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.pick .thumb{width:34px;height:44px;font-size:12px}
.pick .t{font-weight:600;font-size:14px}.pick .s{font-size:12px;color:var(--ink2)}
.picklist{max-height:44vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:0 10px;background:var(--surface)}
.req{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.req.done{opacity:.7}
.req .chkacts .btn{flex:1 1 auto;white-space:nowrap}.req .chkacts .btn.ghost{flex:0 0 auto}
.req ul{margin:8px 0;padding-left:18px;font-size:14px}
.req li .ok{color:var(--ok);font-weight:600}.req li .bad{color:var(--bad);font-weight:600}
.basketbar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom));z-index:40;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:14px 22px;box-shadow:0 10px 24px rgba(194,65,12,.45);font-size:15px}
/* Abstimmungsseite */
body.vote .chips,body.vote .toolbar,body.vote #activeFilters,body.vote .topbar .iconbtn,body.vote #fab{display:none!important}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding-bottom:140px}
.vcard{position:relative;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:6px}
.vcard .cv{aspect-ratio:3/4;border-radius:10px;overflow:hidden;display:grid;place-items:center;font:800 26px Fraunces,serif}
.vcard .cv img{width:100%;height:100%;object-fit:cover}
.vcard .t{font-weight:700;font-size:14px;line-height:1.2}.vcard .s{font-size:12px;color:var(--ink2)}
.vcard .rk{position:absolute;top:-10px;left:-10px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:800 18px Fraunces,serif;color:#111;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.vcard.r1{border-color:#eab308}.vcard.r2{border-color:#94a3b8}.vcard.r3{border-color:#c2410c}
.rk.r1{background:#facc15}.rk.r2{background:#cbd5e1}.rk.r3{background:#fdba74}
.votebar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(14px + env(safe-area-inset-bottom));z-index:40;box-shadow:0 -6px 18px rgba(0,0,0,.08)}
.votebar .in{max-width:1160px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.votebar .sum{flex:1 1 220px;font-size:13px}
.votebar input{height:44px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--surface);flex:1 1 140px;min-width:0}
.links{display:grid;gap:8px;margin:0 0 12px}
.linkbtn{display:flex;align-items:center;gap:8px;justify-content:center;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;text-decoration:none;color:var(--ink)}
.linkbtn.bgg{border-color:#ff5100;color:#c2410c}
.ytbox{position:relative;display:block;border-radius:12px;overflow:hidden;background:#111;aspect-ratio:16/9;max-width:420px;text-decoration:none}
.ytbox img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85}
.ytbox .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:44px;border-radius:12px;background:#ff0000;color:#fff;display:grid;place-items:center;font-size:20px}
.ytbox .lbl{position:absolute;left:10px;bottom:8px;color:#fff;font-weight:600;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.mini{font-size:10px;font-weight:800;border-radius:6px;padding:1px 6px;background:#ff5100;color:#fff;text-decoration:none;letter-spacing:.02em}
.mini.yt{background:#ff0000}
.vlinks{display:flex;gap:6px;flex-wrap:wrap}.vlinks .mini{font-size:11px;padding:3px 8px}
.vcard{cursor:pointer}
.borrow{font-size:11px;font-weight:600;color:#0369a1;border:1px solid currentColor;border-radius:999px;padding:1px 7px}
.borrow.late{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
@media (prefers-color-scheme: dark){.borrow{color:#7dd3fc}}
.wegb{font-size:11px;font-weight:600;color:#7c2d12;background:#fed7aa;border-radius:999px;padding:1px 8px}
.wegsum{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.wegsum .big{font:800 24px Fraunces,serif}
.cl-sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.cl-sec h4{margin:0 0 4px;font:700 15px system-ui;display:flex;justify-content:space-between;gap:8px}
.cl-sec .ok{color:var(--ok);font-weight:600;font-size:14px}
.dupgrp{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px}
.dupgrp label{display:flex;gap:8px;align-items:center;font-size:14px;padding:4px 0}
.mlist{display:grid;gap:4px;margin-top:8px}
.mlist button{display:flex;justify-content:space-between;gap:8px;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:6px 2px;font-size:14px}
/* Plattenladen */
.rstore{border-radius:20px;padding:20px 10px 6px;color:#fef3c7;background:radial-gradient(circle at 15% 0,rgba(251,146,60,.18),transparent 45%),repeating-linear-gradient(0deg,#2b2118 0 3px,#30251b 3px 6px);box-shadow:inset 0 0 50px rgba(0,0,0,.5)}
.rstore-sign{display:block;width:max-content;max-width:100%;margin:0 auto 20px;text-align:center;padding:10px 24px;border:3px solid #fb923c;border-radius:999px;background:#1c1410;box-shadow:0 0 0 4px #1c1410,0 0 20px rgba(251,146,60,.35)}
.rstore-sign b{display:block;font:400 clamp(22px,6vw,36px)/1 Bungee,sans-serif;color:#fb923c;letter-spacing:.06em}
.rstore-sign small{font:600 11px system-ui;letter-spacing:.25em;color:#fde68a}
.crate{position:relative;margin:0 4px 22px;padding:30px 10px 0;background:linear-gradient(#5a3a22,#6f4a2c);border-radius:6px;box-shadow:0 10px 18px rgba(0,0,0,.5),inset 0 0 0 3px #4a2f1b}
.crate-card{position:absolute;top:-12px;left:14px;background:#fffbeb;color:#1c1917;font:400 13px Bungee,sans-serif;padding:6px 12px;border-radius:4px 4px 0 0;transform:rotate(-2deg);box-shadow:0 3px 8px rgba(0,0,0,.4)}
.crate-card span{opacity:.55;font-size:11px;margin-left:6px}
.rec-row{display:flex;gap:30px;padding:0 6px 12px;align-items:flex-end}
.rec{position:relative;width:112px;height:112px;flex:none;border:0;padding:0;background:none;text-align:left}
.rec .disc{position:absolute;top:6px;left:28px;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,var(--lab) 0 16%,#0a0a0a 17% 19%,transparent 20%),repeating-radial-gradient(circle,#111 0 2px,#1f1f1f 2px 3px);box-shadow:0 4px 10px rgba(0,0,0,.6);transition:left .25s}
.rec:hover .disc,.rec:focus-visible .disc{left:44px}
.rec .sleeve{position:absolute;inset:0;border-radius:3px;overflow:hidden;box-shadow:0 6px 12px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.08)}
.rec .sleeve img{width:100%;height:100%;object-fit:cover;display:block}
.rec .sleeve .gen{position:absolute;inset:0;padding:9px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(135deg,rgba(255,255,255,.18),transparent 55%)}
.rec .sleeve .gen i{font:700 10px system-ui;font-style:normal;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.rec .sleeve .gen b{font:800 14px/1.05 Fraunces,Georgia,serif;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.rec .ribbon{position:absolute;top:8px;left:-4px;background:#f59e0b;color:#1c1917;font:800 9px system-ui;padding:2px 6px;border-radius:0 3px 3px 0;z-index:2}
.rec .ribbon.out{background:#ef4444;color:#fff}
.crate-front{height:22px;margin:0 -10px;background:linear-gradient(#7c5232,#5a3a22);border-radius:0 0 6px 6px;box-shadow:inset 0 3px 4px rgba(0,0,0,.35)}
.menusep{font-size:12px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.08em;margin:6px 2px -2px}
.setquick{display:flex;gap:8px;margin:4px 0 6px}.setquick .btn{flex:1}
.setsec{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:10px;overflow:hidden}
.setsec > summary{list-style:none;cursor:pointer;padding:14px;font:700 16px Fraunces,Georgia,serif;display:flex;gap:10px;align-items:center}
.setsec > summary::-webkit-details-marker{display:none}
.setsec > summary::after{content:"›";margin-left:auto;font:400 22px system-ui;color:var(--ink2);transition:transform .2s}
.setsec[open] > summary::after{transform:rotate(90deg)}
.setsec > .card{border:0;border-top:1px solid var(--line);border-radius:0}
.helpcard{display:block!important;font-size:14px;padding:12px 16px 14px;border-top:1px solid var(--line)}.helpcard ul{margin:0;padding-left:18px;display:grid;gap:6px}.helpcard p{margin:0 0 6px}
.tabcfg{display:grid;gap:4px}
.tabrow{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 6px 4px 10px}
.tabrow label{display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px;flex:1;cursor:pointer}
.tabrow input{width:18px;height:18px;accent-color:var(--accent)}
.tabrow.off label{opacity:.5}
.tabrow .btn{height:34px;width:38px;padding:0}
.onb{background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:14px;margin-bottom:14px}
.onbsteps{display:grid;gap:6px;margin-top:8px}
.onbsteps button{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font-size:14px;font-weight:600}
.onbsteps button:disabled{opacity:.6;font-weight:400;text-decoration:line-through}
.onbsteps .ck{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;flex:none}
.onbsteps button:disabled .ck{background:var(--ok);color:#fff}
.rules h4{margin:14px 0 4px;font:700 15px system-ui}.rules ul,.rules ol{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px}.rules p{margin:0;font-size:14px}
.valrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.valrow .hint{grid-column:1/-1}
.autotag{font-size:11px;opacity:.75;cursor:help}
.fld.autofilled input,.fld.autofilled select{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--surface))}
.switch span{flex:1}
.spinner{width:42px;height:42px;border:4px solid var(--surface2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:30px auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
/* Scanner */
.scanbox{position:relative;border-radius:16px;overflow:hidden;background:#000;height:min(58vh,560px);min-height:260px}
.camtools{position:absolute;right:10px;top:10px;display:flex;gap:8px;z-index:2}
.camtools button{width:48px;height:48px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:22px;display:grid;place-items:center;backdrop-filter:blur(4px)}
.camtools button.on{background:#facc15;color:#111}
.scanbox .lasthit{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(0,0,0,.65);color:#fff;border-radius:10px;padding:8px 12px;font-size:14px;z-index:2}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanbox .aim{position:absolute;left:7%;right:7%;top:30%;bottom:30%;border:3px solid rgba(255,255,255,.9);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scanbox .flash{position:absolute;inset:0;background:#22c55e;opacity:0;pointer-events:none;transition:opacity .3s}
.scanlist{display:grid;gap:6px;margin-top:12px;font-size:14px}
.scanlist div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;justify-content:space-between}
/* Toast */
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:300;font-size:14px;box-shadow:var(--shadow);max-width:90vw;animation:up .2s}

/* ====== VIDEOTHEK ====== */
.vt{background:radial-gradient(circle at 20% 10%,rgba(255,79,216,.12),transparent 40%),radial-gradient(circle at 80% 0,rgba(34,211,238,.12),transparent 40%),
  repeating-linear-gradient(45deg,#14112a 0 14px,#17132f 14px 28px);border-radius:20px;padding:22px 10px 8px;color:#fff;overflow:hidden;box-shadow:inset 0 0 60px rgba(0,0,0,.6)}
.vt-sign{text-align:center;font-family:Monoton,Bungee,sans-serif;font-size:clamp(34px,9vw,64px);line-height:1;color:#ffd6f6;
  text-shadow:0 0 4px #fff,0 0 10px #ff4fd8,0 0 22px #ff4fd8,0 0 42px #c026d3;animation:flicker 7s infinite}
.vt-sub{text-align:center;font:400 13px Bungee,sans-serif;letter-spacing:.3em;color:#67e8f9;text-shadow:0 0 8px #22d3ee;margin:8px 0 18px}
@keyframes flicker{0%,18%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.55}}
.vt-aisle{margin:6px 0 14px}
.vt-label{display:inline-block;background:#facc15;color:#1c1917;font:400 13px Bungee,sans-serif;padding:6px 12px;margin:0 0 4px 8px;transform:rotate(-2deg);box-shadow:0 3px 0 #a16207,0 6px 14px rgba(0,0,0,.5);border-radius:3px}
.vt-label span{opacity:.6;font-size:11px;margin-left:6px}
.vt-row{display:flex;gap:10px;align-items:flex-end;padding:12px 10px 0;min-height:60px}
.vt-board{height:12px;margin:0 2px 18px;background:linear-gradient(#e2e8f0,#94a3b8 60%,#475569);border-radius:2px;box-shadow:0 8px 14px rgba(0,0,0,.65)}
.case{--w:96px;width:var(--w);aspect-ratio:.78;flex:none;position:relative;border-radius:4px;overflow:hidden;border:0;padding:0;background:var(--c,#334155);
  box-shadow:0 6px 12px rgba(0,0,0,.6),inset -4px 0 0 rgba(255,255,255,.18),inset 3px 0 0 rgba(0,0,0,.25);transition:transform .15s;text-align:left;color:#fff}
.case:hover,.case:focus-visible{transform:translateY(-4px) rotate(-1deg)}
.case .band{position:absolute;top:0;left:0;right:0;height:16px;display:flex;align-items:center;justify-content:center;font:800 8px/1 system-ui;letter-spacing:.08em;color:#fff;background:#1d4ed8;text-transform:uppercase}
.case .art{position:absolute;top:16px;left:0;right:0;bottom:0}
.case .art img{width:100%;height:100%;object-fit:cover;display:block}
.case .gen{position:absolute;inset:0;padding:8px 7px 28px;display:flex;flex-direction:column;justify-content:flex-end;
  background:linear-gradient(160deg,rgba(255,255,255,.18),transparent 45%),radial-gradient(circle at 70% 30%,rgba(255,255,255,.18),transparent 50%),var(--c)}
.case .gen b{font:800 12px/1.1 system-ui;text-shadow:0 1px 2px rgba(0,0,0,.6);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.case .gen i{font-style:normal;font-size:9px;opacity:.85;margin-top:3px}
.fsk{position:absolute;left:4px;bottom:4px;min-width:19px;height:19px;padding:0 3px;border-radius:3px;font:900 10px/19px system-ui;text-align:center;color:#111;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.fsk.f0{background:#fff}.fsk.f6{background:#facc15}.fsk.f12{background:#22c55e}.fsk.f16{background:#3b82f6;color:#fff}.fsk.f18{background:#ef4444;color:#fff}
.sticker{position:absolute;top:22%;right:-22px;transform:rotate(38deg);background:#ef4444;color:#fff;font:400 9px Bungee,sans-serif;padding:2px 24px;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.sticker.new{background:#22c55e}
.sticker.out{top:auto;bottom:30%;right:auto;left:-20px;transform:rotate(-30deg);background:#ef4444}

/* ====== BÜCHERREGAL ====== */
.bs-tools{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-bottom:10px;font-size:13px;color:var(--ink2)}
.bookcase{background:#5b3a1f;border-radius:10px;padding:14px 14px 0;box-shadow:0 14px 30px rgba(60,30,5,.35),inset 0 0 0 3px #4a2e17;
  background-image:linear-gradient(90deg,rgba(0,0,0,.18),transparent 3%,transparent 97%,rgba(0,0,0,.18))}
.bs-row{display:flex;align-items:flex-end;gap:2px;height:196px;padding:0 10px;background:linear-gradient(#2a1a0d,#3d2614 40%,#3a2412);box-shadow:inset 0 14px 18px -8px rgba(0,0,0,.7),inset 0 -4px 6px rgba(0,0,0,.3);border-radius:3px 3px 0 0;position:relative}
.bs-board{height:16px;background:linear-gradient(#c08a52,#8a5a2e 55%,#6d4421);margin-bottom:14px;border-radius:0 0 3px 3px;box-shadow:0 6px 10px rgba(0,0,0,.4)}
.bs-label{font:600 11px Fraunces,serif;color:#f5deb3;background:#3d2614;display:inline-block;padding:2px 8px;border-radius:3px 3px 0 0;margin-left:10px;letter-spacing:.04em}
.spine{width:var(--w);height:var(--h);flex:none;border:0;padding:8px 0 7px;color:var(--t);border-radius:2px 2px 1px 1px;position:relative;overflow:hidden;
  background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.14) 16%,rgba(255,255,255,0) 38%,rgba(0,0,0,.08) 70%,rgba(0,0,0,.3)),var(--c);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:space-between;transition:transform .15s;transform-origin:bottom left}
.spine:hover,.spine:focus-visible{transform:translateY(-8px)}
.spine.tilt{transform:rotate(-7deg);margin-left:10px}
.spine.hc::before,.spine.hc::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--g,#d4af37);opacity:.85}
.spine.hc::before{top:14px}.spine.hc::after{bottom:24px}
.spine .st{writing-mode:vertical-rl;transform:rotate(180deg);font:700 12px/1.05 Fraunces,Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:calc(var(--h) - 64px);letter-spacing:.01em}
.spine.thin .st{max-height:calc(var(--h) - 24px)}
.spine .sa{writing-mode:vertical-rl;transform:rotate(180deg);font:500 9px/1 system-ui;opacity:.8;white-space:nowrap;overflow:hidden;max-height:36px;flex:none}
.spine.thin .sa{display:none}
.spine .lentmark{position:absolute;top:0;left:0;right:0;height:6px;background:#ef4444}
.bookend{width:26px;height:120px;flex:none;align-self:flex-end;background:linear-gradient(90deg,#111,#3f3f46);clip-path:polygon(0 0,100% 30%,100% 100%,0 100%);margin-left:6px}
.plant{flex:none;align-self:flex-end;margin-left:auto;margin-right:4px;font-size:46px;line-height:1;filter:drop-shadow(0 4px 4px rgba(0,0,0,.5))}

.alink{background:none;border:0;padding:0;font:inherit;color:var(--accent,#c2410c);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.au-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.au-h{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 6px;font:600 15px Fraunces,Georgia,serif}
.au-h span{font:500 12px system-ui;color:var(--ink2)}
.row.ghost{background:transparent;border-style:dashed;box-shadow:none;cursor:default}
.row.ghost .thumb,.row.ghost .rt,.row.ghost .rs{opacity:.45}
.au-miss{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--surface2);color:var(--ink2)}
.row.ghost .au-wish{height:26px;padding:0 8px;font-size:12px;margin-left:auto}
.bs-tools{flex-wrap:wrap}.bs-tools .seg{flex-wrap:wrap}
.home-bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-bottom:8px}
.home-bar .btn{height:38px;padding:0 12px}
.home-tip{margin:0 0 10px;text-align:right}
.home-intro p{color:var(--ink2)}
.fach-h{display:flex;align-items:center;gap:6px;color:#f5deb3;font-size:12px;padding:2px 2px 6px;flex-wrap:wrap}
.fach-h .fn{background:none;border:0;color:inherit;font:600 13px Fraunces,Georgia,serif;padding:4px 2px;cursor:pointer}
.fach-h .fc{opacity:.7}
.fach-h .fa{margin-left:auto;display:flex;gap:4px}
.fach-h .fa button{background:rgba(255,255,255,.14);color:#f5deb3;border:0;border-radius:6px;height:30px;min-width:30px;padding:0 8px;font:600 12px system-ui;cursor:pointer}
.fach-h .fa button:disabled{opacity:.35}
.fach-hint{color:#f5deb3;opacity:.75;font-size:12px;margin:0 0 6px 4px}
.fach-new .bs-row{background:repeating-linear-gradient(135deg,#2a1a0d 0 14px,#33200f 14px 28px)}
.fach-empty{margin:auto;color:rgba(245,222,179,.5);font-size:13px;align-self:center;text-align:center;padding:0 10px}
.spine.edit{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab}
.spine.edit:hover{transform:none}
.spine.picked{outline:3px solid #fbbf24;outline-offset:1px;transform:translateY(-10px)!important}
.spine.dragging{opacity:.25}
.spine.dim{opacity:.22;filter:grayscale(.8)}
.spine.hit{outline:2px solid #fbbf24;outline-offset:1px}
.dragghost{position:fixed;z-index:80;pointer-events:none;opacity:.92;box-shadow:0 12px 24px rgba(0,0,0,.45);transition:none;margin:0}
.dropmark{position:fixed;z-index:79;width:4px;border-radius:2px;background:#fbbf24;box-shadow:0 0 10px #fbbf24;pointer-events:none}
.coverbox2{grid-column:1/-1;display:flex;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.imgslot{display:grid;gap:6px;justify-items:start}
.imgslot .thumb{width:84px;height:110px}

function authorNames(a) {

    part = part.trim(); if (!part) continue;
    if (part.includes(',')) {

      if (sub.length === 2 && !sub[0].includes(' ') ) { out.push(sub[1] + ' ' + sub[0]); continue; } // Nachname, Vorname
      out.push(...sub); continue;
    }
    out.push(part);
  }
  return out.filter(x => x.length > 1);

function guessLang(books) {
  let en = 0, de = 0;
  for (const b of books) {
    const sp = String(b.sprache || '').toLowerCase();
    if (/engl/.test(sp)) { en += 2; continue; } if (/deut|german/.test(sp)) { de += 2; continue; }
    const w = ' ' + String(b.titel || '').toLowerCase().replace(/[^a-zäöüß' ]/g, ' ') + ' ';
    if (/ (the|of|and|a|an|in|to|with|for|my|your|is|on) /.test(w)) en++;
    if (/ (der|die|das|und|von|im|mit|ein|eine|zum|zur|des|dem|den|auf|aus) /.test(w) || /[äöüß]/.test(w)) de++;

}
async function fetchAuthorWorks(name, lang = 'de') {

  const ids = (sr?.search || []).map(x => x.id);
  if (ids.length) {
    const ents = await fetchJSON(WD + 'action=wbgetentities&props=claims&ids=' + ids.join('|'), 8000);
    const humans = ids.map(id => ents?.entities?.[id]).filter(e => e && wdIds(e.claims || {}, 'P31').includes('Q5'));
    const best = humans.find(e => wdIds(e.claims, 'P106').some(o => WD_WRITER.includes(o))) || humans[0];
    qid = best?.id;
  }
  if (qid) {
    const q = `SELECT ?w ?wLabel ?d ?s ?sLabel ?o WHERE {
      ?w wdt:P50 wd:${qid} .
      FILTER NOT EXISTS { ?w wdt:P31 ?t . VALUES ?t { wd:Q3331189 wd:Q13442814 wd:Q1980247 wd:Q277759 wd:Q1667921 wd:Q7725310 wd:Q191067 wd:Q17518557 wd:Q737498 } }
      OPTIONAL { ?w wdt:P577 ?d }
      OPTIONAL { ?w p:P179 ?st . ?st ps:P179 ?s . OPTIONAL { ?st pq:P1545 ?o } }
      SERVICE wikibase:label { bd:serviceParam wikibase:language "${lang === 'en' ? 'en,de' : 'de,en'},mul". }
    } LIMIT 800`;
    const j = await fetchJSON('https://query.wikidata.org/sparql?format=json&query=' + encodeURIComponent(q), 15000);
    const map = new Map();
    for (const b of j?.results?.bindings || []) {
      const id = b.w.value; const t = b.wLabel?.value || ''; if (!t || /^Q\d+$/.test(t)) continue;
      const y = b.d?.value ? parseInt(b.d.value.slice(0, 4), 10) : undefined;
      const r = map.get(id) || { titel: t, jahr: y };
      if (y && (!r.jahr || y < r.jahr)) r.jahr = y;
      if (b.sLabel?.value && !/^Q\d+$/.test(b.sLabel.value) && !r.reihe) { r.reihe = b.sLabel.value.replace(/\s*\((buch|roman)?reihe\)$/i, ''); if (b.o?.value) r.band = b.o.value; }
      map.set(id, r);

    const seen = new Set(works.map(w => normDup(w.titel)));

      if (!(d.author_name || []).some(n => normAuthor(n) === normAuthor(name))) continue;
      const k = normDup(d.title); if (!k || seen.has(k)) continue; seen.add(k);
      works.push({ titel: d.title, jahr: d.first_publish_year });
    }
    if (works.length) src = src ? src + ' + Open Library' : 'Open Library';
  }
  const res = { at: Date.now(), works, src, qid };
  if (works.length) await idb.set(ck, res);
  return res;
}

/* ---------- Sheets (Dialoge) mit Android-Zurück-Taste ---------- */
const sheets = [];
function openSheet(html, { full = false, onClose } = {}) {
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="sheet${full ? ' full' : ''}" role="dialog" aria-modal="true">${full ? '' : '<div class="grip"></div>'}${html}</div>`;
  ov.addEventListener('click', e => { if (e.target === ov) closeSheet(); });
  ov._onClose = onClose;
  document.body.appendChild(ov); sheets.push(ov);
  document.body.style.overflow = 'hidden';
  history.pushState({ sheet: sheets.length }, '');
  return ov.firstElementChild;
}
let popWaiters = [];
function closeSheet() { return new Promise(res => { if (!sheets.length) return res(); popWaiters.push(res); history.back(); }); }
function closeSheets(n) { n = Math.min(n, sheets.length); if (n > 0) history.go(-n); }
window.addEventListener('popstate', () => {
  const depth = history.state?.sheet || 0;
  while (sheets.length > depth) { const s = sheets.pop(); s._onClose?.(); s.remove(); }
  if (!sheets.length) document.body.style.overflow = '';
  popWaiters.splice(0).forEach(f => f());
});
function sheetHead(title, extra = '') { return `<div class="sheet-head"><h2>${esc(title)}</h2>${extra}<button class="iconbtn" data-close aria-label="Schließen">✕</button></div>`; }
document.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeSheet(); });
function toast(msg, ms = 2600) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }

  try { const r = await fetch(src, { mode: 'cors', referrerPolicy: 'no-referrer' }); if (!r.ok) return null; return await blobToDataURL(await r.blob()); } catch { return null; }
}

// --- BoardGameGeek XML API (Token einer registrierten, nicht-kommerziellen Anwendung nötig) ---
// Regeln von BGG: höchstens 1 Anfrage alle 2 Sekunden, Ergebnisse zwischenspeichern, „Powered by BGG“ verlinken.
let bggChain = Promise.resolve(), bggLast = 0;
function bggFetch(path) {
  const run = async () => {
    const wait = 2100 - (Date.now() - bggLast); if (wait > 0) await sleep(wait);
    for (let attempt = 0; attempt < 4; attempt++) {
      bggLast = Date.now();
      let r;
      try { r = await fetch('https://boardgamegeek.com/xmlapi2/' + path, { headers: { Authorization: 'Bearer ' + settings.bggToken } }); }
      catch (e) { const err = new Error('BoardGameGeek nicht erreichbar (Netzwerk oder vom Browser blockiert)'); err.net = true; throw err; }
      if (r.status === 401 || r.status === 403) { const err = new Error('BoardGameGeek lehnt den Token ab (' + r.status + ')'); err.auth = true; throw err; }
      if (r.status === 202 || r.status === 429 || r.status >= 500) { await sleep([2000, 5000, 10000, 20000][attempt]); continue; }
      if (!r.ok) throw new Error('BoardGameGeek: Fehler ' + r.status);
      return new DOMParser().parseFromString(await r.text(), 'text/xml');
    }
    throw new Error('BoardGameGeek ist gerade überlastet – später erneut versuchen');
  };
  const p = bggChain.then(run, run); bggChain = p.catch(() => { }); return p;
}

  const ck = 'bggs:' + normDup(title); const c = await idb.get(ck); if (c && Date.now() - c.at < 30 * 864e5) return c.ids;
  const doc = await bggFetch('search?type=boardgame,boardgameexpansion&query=' + encodeURIComponent(title));
  const nt = normDup(title);
  const hits = [...doc.querySelectorAll('item')].map(x => ({ id: x.getAttribute('id'), name: x.querySelector('name')?.getAttribute('value') || '', year: +(x.querySelector('yearpublished')?.getAttribute('value') || 0) }));

  const score = h => { const k = normDup(h.name); return k === nt ? 3 : (k.startsWith(nt) || nt.startsWith(k)) ? 2 : k.includes(nt) ? 1 : 0; };
  const ids = hits.map(h => [h, score(h)]).filter(([, s]) => s > 0).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([h]) => h.id);

async function aiComplete(rec, fields) {
  const known = {}; for (const f of fieldsOf(rec.typ)) if (!isEmpty(rec[f.k]) && f.k !== 'notizen') known[f.k] = rec[f.k];
  const prompt = `Ergänze fehlende Angaben zu einem Medium aus einer privaten Sammlung. Medientyp: ${TYPES[rec.typ].single}.
Bekannte Angaben: ${JSON.stringify(known)}
Fehlende Felder (bei [..] genau einen dieser Werte verwenden): ${fields.map(f => f.t === 'select' ? `${f.k} [${optsOf(f).join(' | ')}]` : f.k).join(', ')}
Regeln: Fülle nur Felder, bei denen du dir sicher bist (allgemein bekannte Fakten zu genau diesem Titel). Sonst weglassen. Zahlen als Zahlen. Antworte NUR mit JSON: {"felder":{...}}`;
  const text = await aiCall(prompt, null, 800);
  const a = text.indexOf('{'), b = text.lastIndexOf('}'); if (a < 0) return null;
  try { return JSON.parse(text.slice(a, b + 1)).felder || null; } catch { return null; }
}

// Hauptfunktion: ergänzt rec direkt, gibt Liste der ergänzten Felder zurück
async function completeRecord(rec, { useAI = true } = {}) {
  const filled = new Set();
  if (!TYPES[rec.typ] || !rec.titel) return [];
  try {
    if (rec.typ === 'buch') fillMissing(rec, await bookLookup(rec), filled);
    if (rec.typ === 'bluray' && settings.tmdbKey) fillMissing(rec, await tmdbLookup(rec), filled);
    if (rec.typ === 'game' && settings.rawgKey) fillMissing(rec, await rawgLookup(rec), filled);
    if (rec.typ === 'brettspiel' && settings.bggToken) fillMissing(rec, await bggLookup(rec).catch(() => null), filled);
    if (rec.typ === 'vinyl') fillMissing(rec, await mbLookup(rec), filled);
    if (missingFields(rec).length || !hasCover(rec)) fillMissing(rec, await wikidataLookup(rec), filled);
    if (useAI && settings.provider !== 'barcode' && aiKey()) { const miss = missingFields(rec).filter(f => f.ai); if (miss.length) fillMissing(rec, await aiComplete(rec, miss).catch(() => null), filled); }
  } catch (e) { console.warn('Ergänzen', e); }
  return [...filled].filter(k => k !== 'cover');
}
// Gespeichertes Medium im Hintergrund ergänzen (nur leere Felder)
async function autoCompleteItem(id, { quiet = false } = {}) {
  const it = items.find(i => i.id === id); if (!it || it.deleted) return 0;
  const rec = Object.assign({}, it);
  const keys = await completeRecord(rec);
  const cur = items.find(i => i.id === id); if (!cur || cur.deleted) return 0;
  const applied = keys.filter(k => isEmpty(cur[k]));
  const newCover = rec.cover && !cur.cover && (!cur.coverLocal || cur.coverSpine);
  cur.autoAt = Date.now(); if (cur.typ === 'brettspiel' && !cur.bgg && !applied.includes('bgg')) cur.bggTried = true;
  if (!applied.length && !newCover) { await idb.set('items', items); return 0; }
  applied.forEach(k => cur[k] = rec[k]);
  if (newCover) cur.cover = rec.cover;
  cur.auto = [...new Set([...(cur.auto || []), ...applied])];
  cur.updatedAt = Date.now();
  await persist(); render();
  if (!quiet) toast(`„${cur.titel}“: ${applied.length || 'Cover'}${applied.length ? ' Angaben' : ''} online ergänzt`);
  return applied.length || 1;
}
// Vorderseite automatisch aus dem Internet holen, wo nur ein Rücken-Foto oder gar kein Bild da ist (nur kostenlose Quellen)
const imgOk = url => new Promise(res => { const i = new Image(); i.referrerPolicy = 'no-referrer'; i.onload = () => res(i.naturalWidth > 20 && i.naturalHeight > 20); i.onerror = () => res(false); i.src = url; setTimeout(() => res(false), 8000); });
async function findFrontCover(it) {
  const rec = Object.assign({}, it); let url;
  try {
    if (it.typ === 'buch') {
      url = (await bookLookup(rec))?.cover;
      const isbn = String(it.isbn || it.barcode || '').replace(/[^0-9Xx]/g, '');
      if (!url && isbn.length >= 10) { const ol = `https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg?default=false`; if (await imgOk(ol)) url = ol; }
    }
    if (!url && it.typ === 'bluray' && settings.tmdbKey) url = (await tmdbLookup(rec))?.cover;
    if (!url && it.typ === 'game' && settings.rawgKey) url = (await rawgLookup(rec))?.cover;
    if (!url && it.typ === 'vinyl') url = (await mbLookup(rec))?.cover;
    if (!url) url = (await wikidataLookup(rec))?.cover;
  } catch { }

}
let frontBusy = false;

  try {
    const tried = meta.frontTried || (meta.frontTried = {});

// Mehrere Vorschläge aus kostenlosen Quellen (+ TMDb/RAWG mit Schlüssel), damit ihr das richtige auswählen könnt
// Wikipedia-Artikelbilder (englische Wikipedia zeigt bei Spielen, Filmen und Alben meist das Cover; pilicense=any schließt diese ein)
const WP_HINT = { game: ['video game', 'Computerspiel'], brettspiel: ['board game', 'Brettspiel'], bluray: ['film', 'Film'], vinyl: ['album', 'Album'], buch: ['novel', 'Roman'] };
async function wikipediaCovers(it) {
  const [en, de] = WP_HINT[it.typ] || ['', ''];
  const clean = t => String(t || '').toLowerCase().replace(/\(.*?\)/g, ' ').replace(/[^a-z0-9äöüß]/g, '');
  const nt = clean(it.titel); const out = [];
  const extra = it.typ === 'vinyl' && it.interpret ? ' ' + it.interpret : '';
  for (const [lang, hint] of [['en', en], ['de', de]]) {
    const url = `https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=5&gsrsearch=${encodeURIComponent(it.titel + extra + ' ' + hint)}&prop=pageimages&piprop=thumbnail&pithumbsize=500&pilicense=any`;
    const j = await fetchJSON(url, 7000);
    const pages = Object.values(j?.query?.pages || {}).filter(p => p.thumbnail?.source).sort((a, b) => (a.index || 0) - (b.index || 0));
    const match = pages.filter(p => { const k = clean(p.title); return k && nt && (k === nt || (nt.length >= 4 && (k.includes(nt) || nt.includes(k)))); });
    for (const p of match) out.push(p.thumbnail.source);
    if (!match.length && pages[0]) out.push(pages[0].thumbnail.source); // bester Suchtreffer als Vorschlag
  }
  if (it.typ === 'brettspiel' && out.length < 2) { // Fotos von Spielschachteln auf Wikimedia Commons
    const j = await fetchJSON(`https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=4&gsrsearch=${encodeURIComponent(it.titel + ' board game')}&prop=imageinfo&iiprop=url&iiurlwidth=500`, 7000);
    for (const p of Object.values(j?.query?.pages || {}).sort((a, b) => (a.index || 0) - (b.index || 0))) { const u = p.imageinfo?.[0]?.thumburl; if (u && /\.(jpe?g|png|webp)/i.test(u)) out.push(u); }
  }
  return out;
}
async function findCoverCandidates(it) {
  const out = []; const add = u => { if (u && !out.includes(u) && out.length < 6) out.push(u); };
  const rec = Object.assign({}, it);
  try {
    if (it.typ === 'buch') {
      const isbn = String(it.isbn || it.barcode || '').replace(/[^0-9Xx]/g, '');
      if (isbn.length >= 10) { const b = await lookupISBN(isbn).catch(() => null); add(b?.cover); const ol = `https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg?default=false`; if (await imgOk(ol)) add(ol); }
      const q = `intitle:${it.titel}` + (it.autor ? `+inauthor:${authorNames(it.autor)[0] || ''}` : '');
      const g = await fetchJSON('https://www.googleapis.com/books/v1/volumes?maxResults=10&q=' + encodeURIComponent(q), 7000);
      const nt = normDup(it.titel);
      for (const x of g?.items || []) { const v = x.volumeInfo || {}; const k = normDup(v.title); if (!k || !(k === nt || k.includes(nt) || nt.includes(k))) continue; const img = v.imageLinks?.thumbnail || v.imageLinks?.smallThumbnail; if (img) add(img.replace('http://', 'https://').replace('&edge=curl', '')); }
      const ol = await fetchJSON(`https://openlibrary.org/search.json?title=${encodeURIComponent(it.titel)}${it.autor ? '&author=' + encodeURIComponent(authorNames(it.autor)[0] || '') : ''}&fields=cover_i&limit=5`, 7000);
      for (const d of ol?.docs || []) if (d.cover_i) add(`https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg`);
    }
    if (it.typ === 'bluray' && settings.tmdbKey) add((await tmdbLookup(rec))?.cover);
    if (it.typ === 'game' && settings.rawgKey) add((await rawgLookup(rec))?.cover);
    if (it.typ === 'brettspiel' && settings.bggToken) for (const u of await bggCoverCands(it).catch(() => [])) add(u);
    if (it.typ === 'vinyl') add((await mbLookup(rec))?.cover);
    if (!out.length || ['brettspiel', 'game'].includes(it.typ)) add((await wikidataLookup(rec).catch(() => null))?.cover);
    if (out.length < 4) for (const u of await wikipediaCovers(it).catch(() => [])) add(u);
  } catch { }
  // nur Bilder, die wirklich laden
  const ok = await Promise.all(out.map(u => imgOk(u)));
  return out.filter((u, i) => ok[i]).slice(0, 4);
}
async function applyCover(id, url) {
  const cur = byId(id); if (!cur || cur.deleted || hasCover(cur)) return false;
  cur.cover = url; cur.updatedAt = Date.now(); return true;
}

// Viele Medien auf einmal: suchen, dann alle Vorschläge zur Bestätigung zeigen
async function searchCoversBulk(list) {
  const todo = (list || allLive()).filter(i => !i.deleted && TYPES[i.typ] && i.titel && !hasCover(i));
  if (!todo.length) return toast('Alle Medien haben schon ein Cover');
  if (!confirm(`${todo.length} Medien haben noch kein Cover. Jetzt im Internet suchen? Danach entscheidest du bei jedem, ob das gefundene Bild übernommen wird.`)) return;
  const s = openSheet(`${sheetHead('Cover suchen')}<div id="csBody"><div class="spinner"></div><p class="hint" style="text-align:center" id="csProg"></p></div>
    <div class="formfoot" id="csFoot"><button class="btn" id="csStop">Suche beenden</button></div>`, { full: true });
  let stop = false; const found = [];
  $('#csStop', s).onclick = () => { stop = true; };
  s.parentElement._onClose = () => { stop = true; };
  for (let i = 0; i < todo.length && !stop; i++) {
    const p = $('#csProg', s); if (p) p.textContent = `${i + 1} von ${todo.length} · ${found.length} gefunden · „${todo[i].titel}“`;
    const urls = await findCoverCandidates(todo[i]);
    if (urls.length) found.push({ it: todo[i], urls, sel: 0 });
  }
  if (!s.isConnected) return;
  const body = $('#csBody', s), foot = $('#csFoot', s);
  if (!found.length) { body.innerHTML = '<p class="hint" style="text-align:center;padding:20px">Leider keine Cover gefunden. Unter „Bearbeiten“ kannst du selbst eins hochladen.</p>'; foot.innerHTML = '<button class="btn primary" data-close>Schließen</button>'; return; }
  const count = () => found.filter(f => f.sel >= 0).length;
  body.innerHTML = `<p class="hint" style="margin-top:0">Für ${found.length} von ${todo.length} Medien gefunden. Vorausgewählt ist jeweils das erste Bild – tippe ein anderes an oder „✕ keins“, wenn keins passt.</p>
    <div class="inrow" style="margin-bottom:10px"><button class="btn ghost" id="csAll">Alle auswählen</button><button class="btn ghost" id="csNone">Keins auswählen</button></div>
    <div class="cslist">${found.map(f => `<div class="csrow"><div class="cst"><b>${esc(f.it.titel)}</b><small>${esc(subtitle(f.it))}</small></div>${candHTML(f.it.id, f.urls, f.sel)}</div>`).join('')}</div>`;
  const upd = () => { foot.innerHTML = `<button class="btn" data-close>Abbrechen</button><button class="btn primary" id="csApply" ${count() ? '' : 'disabled'}>${count()} Cover übernehmen</button>`; $('#csApply', s).onclick = apply; };
  const setSel = (f, v) => { f.sel = v; $$(`[data-cid="${f.it.id}"]`, body).forEach(x => x.setAttribute('aria-pressed', +x.dataset.ci === v)); };
  body.onclick = e => {
    if (e.target.closest('#csAll')) { found.forEach(f => setSel(f, f.sel >= 0 ? f.sel : 0)); return upd(); }
    if (e.target.closest('#csNone')) { found.forEach(f => setSel(f, -1)); return upd(); }
    const b = e.target.closest('[data-ci]'); if (!b) return; const f = found.find(x => x.it.id === b.dataset.cid); if (!f) return; setSel(f, +b.dataset.ci); upd();
  };
  const apply = async () => { let n = 0; for (const f of found) if (f.sel >= 0 && await applyCover(f.it.id, f.urls[f.sel])) n++; if (n) await persist(); await closeSheet(); render(); toast(`${n} Cover übernommen`); };
  upd();
}

async function completeAll(list) {
  const todo = list ? list.filter(i => !i.deleted) : allLive().filter(i => ((missingFields(i).length || !hasCover(i)) && (!i.autoAt || i.autoAt < (settings.sourcesAt || 0))) || (i.typ === 'brettspiel' && !i.bgg && !i.bggTried));
  if (!todo.length) return toast('Bei allen Medien wurde schon ergänzt');
  if (list) todo.forEach(i => delete i.autoAt);
  const aiNote = settings.provider !== 'barcode' && aiKey() ? `\n\nDie KI wird für Lücken mitgenutzt (ca. ${settings.provider === 'claude' && settings.claudeModel.includes('sonnet') ? '0,3' : '0,05'} Cent pro Medium).` : '';

}

let zxingP = null;
const loadZXing = () => zxingP || (zxingP = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js'; s.onload = () => res(window.ZXing); s.onerror = () => rej(new Error('Barcode-Bibliothek konnte nicht geladen werden')); document.head.appendChild(s); }));
const hasDetector = () => 'BarcodeDetector' in window;
async function detectInImage(dataURL) {
  if (hasDetector()) {
    try {
      const det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] });
      const img = await createImageBitmap(await dataURLToBlob(dataURL));
      const codes = await det.detect(img);
      if (codes.length) return [...new Set(codes.map(c => c.rawValue))];
    } catch { }
  }
  const ZX = await loadZXing();
  try { const r = await new ZX.BrowserMultiFormatReader().decodeFromImageUrl(dataURL); return [r.getText()]; } catch { return []; }
}
function openScanner() {
  const scanned = new Map(); // code -> {frame}
  let stream = null, timer = null, stopped = false, lastCode = '', lastCount = 0;
  const liveScan = !!(hasDetector() && navigator.mediaDevices?.getUserMedia);
  const s = openSheet(`${sheetHead('Barcode scannen')}
    ${liveScan ? `<div class="scanbox"><video playsinline muted autoplay></video><div class="aim"></div><div class="flash"></div></div>
      <p class="hint">Barcode ins Feld halten – jedes erkannte Medium vibriert kurz. Danach einfach das nächste scannen.</p>`
      : `<div class="note">Live-Scan wird von diesem Browser nicht unterstützt. Fotografiere den Barcode (auch mehrere Barcodes auf einem Foto sind möglich).</div>`}
    <div class="inrow" style="margin-top:10px"><input class="select" style="flex:1" id="scManual" inputmode="numeric" placeholder="Nummer manuell eintippen"><button class="btn" id="scAdd">+</button></div>
    <div class="scanlist" id="scList"></div>
    <div class="formfoot"><label class="btn">📷 Foto vom Barcode<input type="file" accept="image/*" capture="environment" hidden id="scPhoto"></label><button class="btn primary" id="scDone" disabled>Fertig</button></div>`,
    { onClose: () => stop() });
  const listEl = $('#scList', s);
  function stop() { stopped = true; clearInterval(timer); stream?.getTracks().forEach(t => t.stop()); }
  function add(code, frame) {
    code = String(code).trim(); if (!code || scanned.has(code)) return;
    scanned.set(code, { frame });
    navigator.vibrate?.(80);
    const fl = $('.flash', s); if (fl) { fl.style.opacity = .35; setTimeout(() => fl.style.opacity = 0, 200); }

  }

    const video = $('video', s);
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false }).then(st => {
      if (stopped) { st.getTracks().forEach(t => t.stop()); return; }
      stream = st; video.srcObject = st; addCamTools(s, st);
      const det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] });
      timer = setInterval(async () => {
        if (video.readyState < 2) return;
        try {
          const codes = await det.detect(video);
          for (const c of codes) {
            // gleiche Nummer 2× hintereinander = stabil erkannt
            if (c.rawValue === lastCode) lastCount++; else { lastCode = c.rawValue; lastCount = 1; }
            if (lastCount >= 2 && !scanned.has(c.rawValue)) {
              const cv = document.createElement('canvas'); const sc = Math.min(1, 1024 / video.videoWidth); cv.width = video.videoWidth * sc; cv.height = video.videoHeight * sc;
              cv.getContext('2d').drawImage(video, 0, 0, cv.width, cv.height);

            }
          }
        } catch { }
      }, 250);
    }).catch(err => { $('.scanbox', s).outerHTML = `<div class="note warn">Kamera nicht verfügbar (${esc(err.message)}). Nutze „Foto vom Barcode“ oder tippe die Nummer ein.</div>`; });
  }
  $('#scAdd', s).onclick = () => { const v = $('#scManual', s).value.replace(/\D/g, ''); if (v) add(v); $('#scManual', s).value = ''; };
  $('#scPhoto', s).onchange = async e => {

    stop();

    s.innerHTML = `${sheetHead('Barcode scannen')}<div class="spinner"></div><p class="hint" style="text-align:center" id="scProg">Schlage ${entries.length} Medien nach …</p>`;

      let rec = await lookupCode(code).catch(() => null);

      }

}

/* ---------- Bestätigungs-Dialog für erkannte Medien ---------- */
const normT = s => String(s || '').toLowerCase().replace(/^(der|die|das|the|ein|eine)\s+/, '').replace(/[^a-z0-9äöüß]/g, '');
function findWish(rec) { return wishes().find(i => (rec.barcode && i.barcode === rec.barcode) || (rec.titel && i.typ === rec.typ && normT(i.titel) === normT(rec.titel))); }
// Neues Medium speichern – steht es auf der Wunschliste, wird der Wunsch zum gekauften Medium
async function saveFound(rec) {
  const w = findWish(rec);
  if (!w) return upsertItem(rec);
  const merged = Object.assign({}, w, rec, { id: w.id }); delete merged.wunsch; delete merged.wunschVon; delete merged.wunschPrio; delete merged.preisCa;
  const it = await upsertItem(merged); it.createdAt = Date.now(); await persist(); toast(`„${w.titel}“ von der Wunschliste übernommen`); return it;
}
async function markBought(id) {
  const w = items.find(i => i.id === id); if (!w) return;
  const rec = Object.assign({}, w); delete rec.wunsch; delete rec.wunschVon; delete rec.wunschPrio;
  if (!rec.kaufpreis && rec.preisCa) rec.kaufpreis = rec.preisCa; delete rec.preisCa;
  rec.kaufdatum = rec.kaufdatum || todayISO();
  const it = await upsertItem(rec); it.createdAt = Date.now(); await persist();
}
function findDuplicate(rec) {
  const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9äöüß]/g, '');
  return live().find(i => (rec.barcode && i.barcode === rec.barcode) || (i.typ === rec.typ && norm(i.titel) === norm(rec.titel) && rec.titel && (rec.typ !== 'game' || !rec.plattform || i.plattform === rec.plattform)));
}
function openReview(queue) {
  let idx = 0, added = 0;
  const s = openSheet(`<div id="rv"></div>`, { full: true });
  async function show() {
    if (idx >= queue.length) { closeSheet(); render(); toast(`${added} von ${queue.length} hinzugefügt`); return; }
    const rec = queue[idx];
    const box = $('#rv', s);
    const draw = () => {
      const t = TYPES[rec.typ];
      const facts = fieldsOf(rec.typ).filter(f => f.k !== 'titel' && f.t !== 'url' && rec[f.k] != null && rec[f.k] !== '').map(f => `<dt>${esc(f.l)}</dt><dd>${esc(fmt(f, rec[f.k]))}${(rec._auto || []).includes(f.k) ? ' <span class="autotag" title="Online ergänzt">🌐</span>' : ''}</dd>`).join('');
      const dup = findDuplicate(rec);
      const cov = (rec._coverSpine && rec.cover) || rec._coverData || rec.cover;
      const c = colorFor(rec.titel);
      box.innerHTML = `<div class="wrap" style="max-width:640px;padding:0">${sheetHead(`Erkannt ${idx + 1} von ${queue.length}`)}
        <div class="rv-progress"><div style="width:${(idx / queue.length) * 100}%"></div></div>
        <p class="hint" style="margin-top:0">Wurde das richtig erkannt?</p>
        <div class="rv-card"><div class="detail-top"><div class="thumb" style="background:${c};color:${textOn(c)}">${cov ? `<img src="${esc(cov)}" referrerpolicy="no-referrer" alt="" onerror="this.remove()">` : `<span class="ph">${esc(initials(rec.titel))}</span>`}</div>
          <div><span class="tb ${rec.typ}">${esc(t?.single || rec.typ)}</span> <span class="conf ${rec._conf}">Sicherheit: ${rec._conf}</span>
          <h3 style="margin-top:8px">${esc(rec.titel || '(Titel unbekannt)')}</h3><div class="hint">${esc(subtitle(rec))}</div></div></div>
          ${rec._hint ? `<div class="note warn" style="margin-bottom:10px">${esc(rec._hint)}</div>` : ''}
          ${findWish(rec) ? `<div class="note" style="margin-bottom:10px">★ Steht auf eurer Wunschliste – wird beim Hinzufügen von dort übernommen.</div>` : ''}
          ${dup ? `<div class="note warn" style="margin-bottom:10px">⚠ Scheint schon in eurer Sammlung zu sein: „${esc(dup.titel)}“${dup.plattform ? ' (' + esc(dup.plattform) + ')' : ''}</div>` : ''}
          ${linksHTML(rec)}<dl class="facts">${facts || '<dt>Keine weiteren Angaben</dt><dd></dd>'}</dl>${!rec._checked && settings.autoFill ? '<p class="hint" id="rvEnr">🌐 Ergänze fehlende Angaben online …</p>' : ''}</div>
        <div class="rv-actions"><button class="btn ok yes" id="rvYes" ${rec.titel ? '' : 'disabled'}>✓ Richtig – hinzufügen</button><button class="btn" id="rvFix">✎ Korrigieren</button><button class="btn danger" id="rvNo">✕ Verwerfen</button></div>
        ${queue.length - idx > 1 ? `<p style="text-align:center;margin-top:18px"><button class="btn ghost" id="rvAll" style="font-size:13px">Alle restlichen ${queue.length - idx} ungeprüft übernehmen</button></p>` : ''}</div>`;
      $('#rvYes', box).onclick = async () => { await saveFound(clean(rec)); added++; idx++; show(); };
      $('#rvYes', box).disabled = !rec.titel || (!rec._checked && settings.autoFill);
      $('#rvNo', box).onclick = () => { idx++; show(); };
      $('#rvFix', box).onclick = () => openForm({ prefill: Object.assign({}, rec, { _checked: true }), title: 'Korrigieren', onSaved: () => { added++; idx++; show(); } });
      const all = $('#rvAll', box);
      if (all) all.onclick = async () => { if (!confirm('Alle restlichen Treffer ohne Prüfung übernehmen?')) return; for (; idx < queue.length; idx++) if (queue[idx].titel) { const r = queue[idx]; if (!r._checked && settings.autoFill) { r._auto = await completeRecord(r); r._checked = true; } await saveFound(clean(r)); added++; } show(); };
    };
    draw();
    if (!rec._checked && settings.autoFill) { rec._auto = await completeRecord(rec); rec._checked = true; if (queue[idx] === rec) draw(); }
  }
  const clean = rec => { const o = {}; for (const [k, v] of Object.entries(rec)) if (!k.startsWith('_') || ['_coverData', '_coverSpine', '_coverAspect'].includes(k)) o[k] = v; if (rec._auto?.length) o.auto = rec._auto.filter(k => !isEmpty(rec[k])); if (rec._checked) o.autoAt = Date.now(); return o; };
  show();
}

/* ---------- Filter-Dialog ---------- */
function openFilters() {
  const ff = filterFields();
  const scope = TYPES[ui.type] ? ui.type : null;
  const pool = live().filter(i => !scope || i.typ === scope);
  const sel = (k, label, opts) => `<label class="fld"><span>${esc(label)}</span><select name="${k}"><option value="">Alle</option>${opts.map(([v, l]) => `<option value="${esc(v)}" ${String(ui.filters[k] ?? '') === String(v) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label>`;
  let html = '';
  for (const f of ff) {
    if (f.f === 'lent') { if (ui.type !== 'verliehen') html += sel('_lent', 'Verliehen', [['ja', 'Nur verliehene'], ['nein', 'Nur vorhandene']]); continue; }
    if (f.t === 'rating') { html += sel('bewertung', 'Bewertung', [1, 2, 3, 4, 5].map(n => [n, 'mindestens ' + '★'.repeat(n)])); continue; }
    let vals = [...new Set(pool.map(i => i[f.k]).filter(v => v != null && v !== '').map(String))];
    if (f.t === 'select') { const o = optsOf(f); vals.sort((a, b) => (o.indexOf(a) + 1 || 999) - (o.indexOf(b) + 1 || 999) || a.localeCompare(b, 'de')); }
    else if (f.t === 'year') vals.sort((a, b) => b - a); else vals.sort((a, b) => a.localeCompare(b, 'de'));
    if (!vals.length) continue;
    html += sel(f.k, f.l, vals.map(v => [v, v]));
  }
  if (ui.type === 'wunsch') {
    const w = wishes();
    html = sel('typ', 'Medienart', TYPE_KEYS.filter(t => w.some(i => i.typ === t)).map(t => [t, TYPES[t].label]))
      + sel('wunschVon', 'Wunsch von', [...new Set(w.map(i => i.wunschVon).filter(Boolean))].map(v => [v, v]))
      + sel('wunschPrio', 'Priorität', ['Hoch', 'Mittel', 'Niedrig'].filter(p => w.some(i => i.wunschPrio === p)).map(v => [v, v]));
  }
  if (ui.type === 'verliehen' && VIEW) html = sel('typ', 'Medienart', TYPE_KEYS.map(t => [t, TYPES[t].label]));
  else if (ui.type === 'verliehen') {
    const lent = live().filter(i => i.verliehenAn);
    html = sel('verliehenAn', 'Verliehen an', [...new Set(lent.map(i => i.verliehenAn))].sort((a, b) => a.localeCompare(b, 'de')).map(v => [v, v]))
      + sel('typ', 'Medienart', TYPE_KEYS.filter(t => lent.some(i => i.typ === t)).map(t => [t, TYPES[t].label]))
      + sel('besitzer', 'Gehört', [...new Set(lent.map(i => i.besitzer).filter(Boolean))].map(v => [v, v]));
  }
  if (ui.type === 'brettspiel') html = sel('_players', 'Geeignet für Spieleranzahl', [1, 2, 3, 4, 5, 6, 7, 8, 10].map(n => [n, n + ' Spieler'])) + html;
  const s = openSheet(`${sheetHead('Filter' + (scope ? ' · ' + TYPES[scope].label : ''))}
    ${scope || ['verliehen', 'wunsch'].includes(ui.type) ? '' : '<p class="hint" style="margin-top:0">Wähle oben eine Medienart, um nach weiteren Angaben (Genre, Plattform, Autor …) zu filtern.</p>'}
    <form class="form" id="flt">${html || '<p class="hint">Noch keine Werte zum Filtern vorhanden.</p>'}</form>
    <div class="formfoot"><button class="btn" id="fltReset">Zurücksetzen</button><button class="btn primary" id="fltApply">Anwenden</button></div>`);
  $('#fltApply', s).onclick = () => { const fd = new FormData($('#flt', s)); ui.filters = {}; for (const [k, v] of fd.entries()) if (v !== '') ui.filters[k] = v; closeSheet(); render(); };
  $('#fltReset', s).onclick = () => { ui.filters = {}; closeSheet(); render(); };
}
