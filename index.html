let xlsxP = null;
const loadXLSX = () => xlsxP || (xlsxP = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = () => res(window.XLSX); s.onerror = () => { xlsxP = null; rej(new Error('Excel-Bibliothek konnte nicht geladen werden (Internet?)')); }; document.head.appendChild(s); }));
async function exportExcel() {
  const XLSX = await loadXLSX();
  const wb = XLSX.utils.book_new();
  for (const t of TYPE_KEYS) {
    const fields = fieldsOf(t).filter(f => !f.wish);
    const rows = live().filter(i => i.typ === t).sort(SORTS.titel.fn).map(it => {
      const r = {};
      for (const f of fields) {
        const v = it[f.k];
        r[f.l] = v == null || v === '' ? '' : f.t === 'rating' ? +v : f.t === 'date' ? fmt(f, v) : ['number', 'year'].includes(f.t) ? +v : String(v);
      }
      r['Hinzugefügt am'] = new Date(it.createdAt).toLocaleDateString('de-DE');
      r['Geschätzter Wert (€)'] = it.wert?.ca ? +it.wert.ca : '';
      return r;
    });
    const header = [...fields.map(f => f.l), 'Hinzugefügt am', 'Geschätzter Wert (€)'];
    const ws = XLSX.utils.json_to_sheet(rows, { header });
    ws['!cols'] = header.map(h => ({ wch: Math.min(45, Math.max(h.length + 2, ...rows.map(r => String(r[h] ?? '').length + 1))) }));
    if (rows.length) ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: rows.length, c: header.length - 1 } }) };
    XLSX.utils.book_append_sheet(wb, ws, TYPES[t].sheet);
  }
  {
    const lent = live().filter(i => i.verliehenAn).sort((a, b) => String(a.verliehenAm || '').localeCompare(String(b.verliehenAm || '')));
    const rows = lent.map(it => ({ 'Titel': it.titel, 'Medienart': TYPES[it.typ]?.single || it.typ, 'Verliehen an': it.verliehenAn, 'Verliehen am': it.verliehenAm ? deDate(it.verliehenAm) : '', 'Tage': it.verliehenAm ? daysSince(it.verliehenAm) : '', 'Gehört': it.besitzer || '' }));
    const header = ['Titel', 'Medienart', 'Verliehen an', 'Verliehen am', 'Tage', 'Gehört'];
    const ws = XLSX.utils.json_to_sheet(rows, { header });
    ws['!cols'] = header.map(h => ({ wch: Math.min(45, Math.max(h.length + 2, ...rows.map(r => String(r[h] ?? '').length + 1))) }));
    XLSX.utils.book_append_sheet(wb, ws, 'Verliehen');
  }
  {
    const rows = wishes().sort(SORTS.prio.fn).map(it => ({ 'Titel': it.titel, 'Medienart': TYPES[it.typ]?.single || it.typ, 'Details': subtitle(it), 'Wunsch von': it.wunschVon || '', 'Priorität': it.wunschPrio || '', 'Preis ca. (€)': it.preisCa != null ? +it.preisCa : '', 'Notizen': it.notizen || '' }));
    const header = ['Titel', 'Medienart', 'Details', 'Wunsch von', 'Priorität', 'Preis ca. (€)', 'Notizen'];
    const ws = XLSX.utils.json_to_sheet(rows, { header });
    ws['!cols'] = header.map(h => ({ wch: Math.min(45, Math.max(h.length + 2, ...rows.map(r => String(r[h] ?? '').length + 1))) }));
    XLSX.utils.book_append_sheet(wb, ws, 'Wunschliste');
  }
  const extraSheet = (name, list, cols) => { if (!list.length) return; const ws = XLSX.utils.json_to_sheet(list, { header: cols }); ws['!cols'] = cols.map(h => ({ wch: Math.min(45, Math.max(h.length + 2, ...list.map(r => String(r[h] ?? '').length + 1))) })); XLSX.utils.book_append_sheet(wb, ws, name); };
  extraSheet('Von anderen geliehen', borrowed().map(it => ({ 'Titel': it.titel, 'Medienart': TYPES[it.typ]?.single, 'Geliehen von': it.geliehenVon || '', 'Geliehen am': it.geliehenAm ? deDate(it.geliehenAm) : '', 'Zurückgeben bis': it.rueckgabeBis ? deDate(it.rueckgabeBis) : '' })), ['Titel', 'Medienart', 'Geliehen von', 'Geliehen am', 'Zurückgeben bis']);
  extraSheet('Aussortieren', live().filter(i => i.weg).map(it => ({ 'Titel': it.titel, 'Medienart': TYPES[it.typ]?.single, 'Details': subtitle(it), 'Zustand': it.zustand || it.zustandPlatte || '', 'Was': it.weg.art, 'Preis (€)': it.weg.preis != null ? +it.weg.preis : '', 'Notiz': it.weg.notiz || '' })), ['Titel', 'Medienart', 'Details', 'Zustand', 'Was', 'Preis (€)', 'Notiz']);
  const d = new Date();
  XLSX.writeFile(wb, `Mediathek_${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}.xlsx`);
}

/* ---------- Dropbox (ohne Server, PKCE + Code zum Einfügen) ---------- */
let dbxAccess = null;
const dbxConnected = () => !!(settings.dbxAppKey && settings.dbxRefresh);
// Bereit zum Sync = angemeldet UND Ordner gewählt (z. B. euer gemeinsam geteilter Ordner)
const dbxReady = () => dbxConnected() && typeof settings.dbxFolder === 'string';
const P = sub => (settings.dbxFolder || '') + sub;
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const DBX_SCOPES = ['account_info.read', 'files.metadata.read', 'files.content.read', 'files.content.write', 'sharing.read', 'sharing.write'];
const dbxMissingScopes = () => settings.dbxScope ? DBX_SCOPES.filter(x => x !== 'account_info.read' && !settings.dbxScope.split(' ').includes(x)) : [];
async function dbxStartAuth() {
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  sessionStorage.setItem('dbx_verifier', verifier);
  // Berechtigungen ausdrücklich anfordern: Fehlt eine in der Dropbox-App, meldet Dropbox das sofort beim Anmelden
  window.open(`https://www.dropbox.com/oauth2/authorize?client_id=${encodeURIComponent(settings.dbxAppKey)}&response_type=code&code_challenge=${challenge}&code_challenge_method=S256&token_access_type=offline&force_reapprove=true&scope=${encodeURIComponent(DBX_SCOPES.join(' '))}`, '_blank');
}
async function dbxFinishAuth(code) {
  const body = new URLSearchParams({ code: code.trim(), grant_type: 'authorization_code', client_id: settings.dbxAppKey, code_verifier: sessionStorage.getItem('dbx_verifier') || '' });
  const r = await fetch('https://api.dropboxapi.com/oauth2/token', { method: 'POST', body });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.refresh_token) throw new Error(j.error_description || j.error || 'Anmeldung fehlgeschlagen');
  settings.dbxRefresh = j.refresh_token; settings.dbxScope = j.scope || ''; saveSettings();
  dbxAccess = { token: j.access_token, exp: Date.now() + (j.expires_in - 60) * 1000 };
  const miss = dbxMissingScopes(); if (miss.length) alert('Achtung: Der Dropbox-App fehlen noch Berechtigungen: ' + miss.join(', ') + '.\n\nIn der Dropbox-App-Konsole unter „Permissions“ anhaken, „Submit“ klicken, dann hier Dropbox trennen und neu verbinden.');
  settings.dbxFolder = null; saveSettings();
  meta.remoteRev = null; await saveMeta();
}
async function dbxToken() {
  if (dbxAccess && dbxAccess.exp > Date.now()) return dbxAccess.token;
  const r = await fetch('https://api.dropboxapi.com/oauth2/token', { method: 'POST', body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: settings.dbxRefresh, client_id: settings.dbxAppKey }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { if (r.status === 400 || r.status === 401) { settings.dbxRefresh = ''; saveSettings(); } throw new Error('Dropbox-Anmeldung abgelaufen – bitte neu verbinden'); }
  dbxAccess = { token: j.access_token, exp: Date.now() + (j.expires_in - 60) * 1000 };
  if (j.scope && j.scope !== settings.dbxScope) { settings.dbxScope = j.scope; saveSettings(); }
  return dbxAccess.token;
}
async function dbxRpc(ep, body) {
  const r = await fetch('https://api.dropboxapi.com/2/' + ep, { method: 'POST', headers: { Authorization: 'Bearer ' + await dbxToken(), 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const txt = await r.text(); let j = {}; try { j = JSON.parse(txt); } catch { }
  if (!r.ok) { const e = new Error(ep + ' (' + r.status + '): ' + (j.error_summary || txt || '') + (j.user_message?.text ? ' – ' + j.user_message.text : '')); e.status = r.status; e.summary = j.error_summary || ''; e.raw = txt; throw e; }
  return j;
}
async function dbxMeta(path) { try { return await dbxRpc('files/get_metadata', { path }); } catch (e) { if (e.status === 409 && /not_found/.test(e.summary)) return null; throw e; } }
async function dbxDownload(path) {
  const r = await fetch('https://content.dropboxapi.com/2/files/download', { method: 'POST', headers: { Authorization: 'Bearer ' + await dbxToken(), 'Dropbox-API-Arg': JSON.stringify({ path }) } });
  if (r.status === 409) return null;
  if (!r.ok) { const t = await r.text().catch(() => ''); const e = new Error('files/download (' + r.status + '): ' + t.slice(0, 300)); e.status = r.status; e.raw = t; throw e; }
  return r.blob();
}
async function dbxUpload(path, data, mode) {
  const r = await fetch('https://content.dropboxapi.com/2/files/upload', { method: 'POST', headers: { Authorization: 'Bearer ' + await dbxToken(), 'Content-Type': 'application/octet-stream', 'Dropbox-API-Arg': JSON.stringify({ path, mode, autorename: false, mute: true }) }, body: data });
  const txt = await r.text(); let j = {}; try { j = JSON.parse(txt); } catch { }
  if (!r.ok) { const e = new Error('files/upload (' + r.status + '): ' + (j.error_summary || txt || '') + (j.user_message?.text ? ' – ' + j.user_message.text : '')); e.status = r.status; e.summary = j.error_summary || ''; e.raw = txt; e.conflict = r.status === 409 && /conflict/.test(j.error_summary || ''); throw e; }
  return j;
}


/* ---------- Dropbox-Ordner wählen (auch geteilte Ordner) ---------- */
async function dbxListFolders(path) {
  let j = await dbxRpc('files/list_folder', { path, include_mounted_folders: true, limit: 2000 });
  const all = [...j.entries];
  while (j.has_more) { j = await dbxRpc('files/list_folder/continue', { cursor: j.cursor }); all.push(...j.entries); }
  return all;
}

function explainSyncErr(e) {
  const m = String((e && ((e.summary || '') + ' ' + (e.message || ''))) || e || '');
  if (!navigator.onLine) return ['Kein Internet', 'Das Gerät ist offline. Sobald es wieder online ist, synchronisiert die App von selbst.'];
  if (/missing_scope|required_scope|scope/i.test(m)) return ['Der Dropbox-App fehlen Berechtigungen', 'In der Dropbox-App-Konsole (dropbox.com/developers/apps → eure App → Reiter „Permissions“) diese Haken setzen: files.metadata.read, files.content.read, files.content.write, sharing.read, sharing.write. Unten auf „Submit“ klicken. Danach hier unter Einstellungen → Dropbox-Synchronisierung „Trennen“ und neu verbinden – erst dann gelten die neuen Berechtigungen.'];
  if (/abgelaufen|invalid_access_token|expired_access_token|401/i.test(m)) return ['Dropbox-Anmeldung abgelaufen', 'Unter Einstellungen → Dropbox-Synchronisierung neu verbinden. Die Daten auf dem Gerät bleiben erhalten.'];
  if (/not_found|malformed_path/i.test(m)) return ['Ordner nicht gefunden', 'Der gewählte Dropbox-Ordner existiert nicht (mehr) oder wurde umbenannt. Unter Einstellungen → Dropbox-Synchronisierung den Ordner neu wählen.'];
  if (/no_write_permission|access_denied|read_only/i.test(m)) return ['Keine Schreibrechte im Ordner', 'Der Ordner ist für dieses Konto nur lesbar freigegeben. In Dropbox beim geteilten Ordner die Freigabe auf „Kann bearbeiten“ ändern.'];
  if (/insufficient_space/i.test(m)) return ['Dropbox ist voll', 'Im Dropbox-Konto ist kein Speicherplatz mehr frei.'];
  if (/too_many|rate_limit|429/i.test(m)) return ['Dropbox bremst gerade', 'Zu viele Anfragen in kurzer Zeit. In ein paar Minuten klappt es wieder von selbst.'];
  if (/Failed to fetch|NetworkError|Load failed|TypeError/i.test(m)) return ['Dropbox nicht erreichbar', 'Die Verbindung zu Dropbox wurde blockiert. Häufige Ursachen: Werbeblocker, Datenspar-Modus, VPN oder ein Firmen-/Gast-WLAN. Kurz im Mobilfunknetz probieren.'];
  if (/JSON|Unexpected token/i.test(m)) return ['Datei in der Dropbox beschädigt', 'Die Datei mediathek.json im Ordner ist nicht lesbar. In Dropbox über „Versionsverlauf“ eine ältere Version wiederherstellen oder mir die Meldung unten schicken.'];
  return ['Unbekannter Fehler', 'Bitte die technische Meldung unten kopieren und an Claude schicken.'];
}

async function dbxDiagnose(out) {

  const errTxt = e => String(e.message || e) + (e.raw && !String(e.message).includes(e.raw.slice(0, 40)) ? ' | ' + e.raw.slice(0, 400) : '');
  add(null, 'Mediathek ' + APP_VERSION + ', Ordner „' + (settings.dbxFolder || '(Wurzel)') + '“');
  try { await dbxToken(); add(true, 'Anmeldung'); } catch (e) { add(false, 'Anmeldung', errTxt(e)); return lines; }
  if (settings.dbxScope) { const miss = dbxMissingScopes(); add(!miss.length, 'Berechtigungen dieser Anmeldung', miss.length ? 'es fehlen ' + miss.join(', ') + ' → in der Dropbox-App-Konsole anhaken, „Submit“, dann hier trennen und neu verbinden' : 'vollständig'); }
  try {
    const a = await dbxRpc('users/get_current_account', null);
    add(true, 'Konto', `${a.account_type?.['.tag'] || '?'}, E-Mail bestätigt: ${a.email_verified ? 'ja' : 'NEIN'}${a.root_info && a.root_info.root_namespace_id !== a.root_info.home_namespace_id ? ', Team-Bereich' : ''}`);
    if (!a.email_verified) add(false, 'Dropbox erlaubt Apps erst nach bestätigter E-Mail-Adresse das Schreiben');
  } catch (e) { add(false, 'Konto', errTxt(e)); }
  try {
    const f = settings.dbxFolder ? await dbxRpc('files/get_metadata', { path: settings.dbxFolder }) : { '.tag': 'folder' };
    add(f['.tag'] === 'folder', 'Ordner', f['.tag'] === 'folder' ? (f.sharing_info ? 'geteilt' + (f.sharing_info.read_only ? ', NUR LESEN' : ', bearbeiten erlaubt') : 'nicht geteilt') : 'ist kein Ordner');
  } catch (e) { add(false, 'Ordner', errTxt(e)); }
  try { const m = await dbxMeta(P('/mediathek.json')); add(true, 'mediathek.json', m ? `vorhanden, ${Math.round(m.size / 1024)} KB` : 'noch nicht vorhanden (wird angelegt)'); }
  catch (e) { add(false, 'mediathek.json lesen', errTxt(e)); }
  try {
    await dbxUpload(P('/.mediathek-test.txt'), 'Test ' + new Date().toISOString(), { '.tag': 'overwrite' }); add(true, 'Schreiben');
    try { await dbxRpc('files/delete_v2', { path: P('/.mediathek-test.txt') }); } catch { }
  } catch (e) { add(false, 'Schreiben', errTxt(e)); }
  return lines;
}

  $('#sBkRestore', s).onclick = () => openBackupRestore();

  const savePersons = async () => { shared.person1 = $('#sP1', s).value.trim(); shared.person2 = $('#sP2', s).value.trim(); shared.updatedAt = Date.now(); await idb.set('shared', shared); meta.seq++; await saveMeta(); scheduleSync(); };

/* =========================================================
   Schnellcheck: „Haben wir das schon?“
   ========================================================= */
function openCheck() {
  let stream = null, timer = null, stopped = false, lastCode = '', lastCount = 0, busyCode = '';
  const liveScan = !!(hasDetector() && navigator.mediaDevices?.getUserMedia);
  const s = openSheet(`${sheetHead('Haben wir das schon?')}
    ${liveScan ? `<div class="scanbox"><video playsinline muted autoplay></video><div class="aim"></div><div class="flash"></div></div>`
      : `<label class="btn" style="width:100%">📷 Barcode fotografieren<input type="file" accept="image/*" capture="environment" hidden id="ckPhoto"></label>`}
    <div class="search" style="margin-top:10px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="ckQ" type="search" placeholder="…oder Titel / Nummer eintippen" autocomplete="off"></div>
    <div id="ckOut"><p class="hint" style="text-align:center;margin-top:16px">${liveScan ? 'Barcode vor die Kamera halten.' : 'Barcode fotografieren oder Titel eintippen.'}</p></div>`, { onClose: () => stop() });
  const out = $('#ckOut', s);
  function stop() { stopped = true; clearInterval(timer); stream?.getTracks().forEach(t => t.stop()); }
  const card = (cls, ic, big, sub, it) => `<div class="verdict ${cls}">${it ? thumbHTML(it) : `<span class="ic">${ic}</span>`}<div><div class="big">${big}</div><div class="hint" style="color:var(--ink)">${sub}</div></div></div>`;
  async function checkCode(code) {
    code = String(code).replace(/[^0-9Xx]/g, ''); if (!code || code === busyCode) return;
    busyCode = code;
    const fl = $('.flash', s); if (fl) { fl.style.opacity = .3; setTimeout(() => fl.style.opacity = 0, 200); }
    const own = live().find(i => i.barcode === code || String(i.isbn || '').replace(/[^0-9Xx]/g, '') === code);
    if (own) return showOwned(own, 'Gleiche Ausgabe (Barcode stimmt überein)');
    const w = wishes().find(i => i.barcode === code || String(i.isbn || '').replace(/[^0-9Xx]/g, '') === code);
    if (w) return showWish(w);
    out.innerHTML = `<div class="spinner"></div><p class="hint" style="text-align:center">Suche ${esc(code)} online …</p>`;
    const rec = await lookupCode(code).catch(() => null);
    if (stopped) return;
    if (!rec) {
      navigator.vibrate?.([60, 60, 60]);
      out.innerHTML = card('maybe', '❔', 'Unbekannter Barcode', `Zu ${esc(code)} kein Titel gefunden. Gib den Titel oben ein, um nachzusehen.`);
      return;
    }
    const dup = findDuplicate(rec);
    if (dup) return showOwned(dup, 'Gleicher Titel, evtl. andere Ausgabe' + (rec.format && dup.format && rec.format !== dup.format ? ` (ihr habt: ${esc(dup.format)})` : ''));
    const w2 = findWish(rec); if (w2) return showWish(w2);
    showMissing(rec);
  }
  function showOwned(it, why) {
    navigator.vibrate?.(150);
    out.innerHTML = card('yes', '✓', 'Habt ihr schon!', `<b>${esc(it.titel)}</b><br>${esc(subtitle(it))}<br>${esc(why)}${it.verliehenAn ? '<br><b>' + esc(lentText(it)) + '</b>' : ''}${it.besitzer ? '<br>Gehört: ' + esc(it.besitzer) : ''}`, it)
      + `<div class="chkacts"><button class="btn" data-ck="open">Ansehen</button></div>`;
    hydrateCovers(out);
    out.querySelector('[data-ck=open]').onclick = () => openDetail(it.id);
  }
  function showWish(it) {
    navigator.vibrate?.([80, 40, 80]);
    out.innerHTML = card('wish', '★', 'Steht auf eurer Wunschliste', `<b>${esc(it.titel)}</b>${it.wunschVon ? '<br>Wunsch von ' + esc(it.wunschVon) : ''}${it.preisCa ? '<br>Preis ca. ' + esc(fmt({ k: 'kaufpreis' }, it.preisCa)) : ''}`, it)
      + `<div class="chkacts"><button class="btn ok" data-ck="bought">✓ Gekauft – in die Sammlung</button></div>`;
    hydrateCovers(out);
    out.querySelector('[data-ck=bought]').onclick = async () => { await markBought(it.id); render(); toast(`„${it.titel}“ ist jetzt in eurer Sammlung`); busyCode = ''; showOwned(items.find(i => i.id === it.id), 'Gerade gekauft'); };
  }
  function showMissing(rec) {
    navigator.vibrate?.(400);
    const tmp = Object.assign({ id: '_ck' }, rec);
    out.innerHTML = card('no', '✗', 'Habt ihr noch nicht', `<b>${esc(rec.titel)}</b><br>${esc(subtitle(rec))}`)
      + `<div class="chkacts"><button class="btn" data-ck="wish">★ Auf die Wunschliste</button><button class="btn ok" data-ck="buy">✓ Gekauft – hinzufügen</button></div>`;
    out.querySelector('[data-ck=wish]').onclick = async () => {
      const r = Object.assign({}, rec, { wunsch: true }); if (settings.autoFill) await completeRecord(r).catch(() => { });
      const it = await upsertItem(r); render(); toast(`„${it.titel}“ auf die Wunschliste gesetzt`); busyCode = ''; showWish(it);
    };
    out.querySelector('[data-ck=buy]').onclick = async () => { await closeSheet(); openReview([Object.assign({ _conf: 'hoch' }, rec)]); };
  }
  // Titelsuche
  let qT;
  $('#ckQ', s).oninput = e => {
    clearTimeout(qT); const q = e.target.value.trim();
    qT = setTimeout(() => {
      if (/^\d{8,13}$/.test(q)) return checkCode(q);
      busyCode = '';
      if (q.length < 2) { out.innerHTML = ''; return; }
      const terms = q.toLowerCase().split(/\s+/);
      const hits = allLive().filter(i => terms.every(t => [i.titel, i.originaltitel, i.untertitel, i.autor, i.reihe].join(' ').toLowerCase().includes(t))).slice(0, 8);
      if (!hits.length) {
        out.innerHTML = card('no', '✗', 'Nicht in eurer Sammlung', `Nichts gefunden zu „${esc(q)}“.`) + `<div class="chkacts"><button class="btn" data-ck="wishq">★ „${esc(q)}“ auf die Wunschliste</button></div>`;
        out.querySelector('[data-ck=wishq]').onclick = () => openForm({ prefill: { wunsch: true, titel: q, typ: TYPES[ui.type] ? ui.type : 'buch' }, title: 'Neuer Wunsch' });
        return;
      }
      const owned = hits.filter(i => !i.wunsch && !i.geliehen).length;
      out.innerHTML = (owned ? card('yes', '✓', `${owned === 1 ? '1 Treffer' : owned + ' Treffer'} in eurer Sammlung`, 'Tippe einen Treffer an für Details.') : card('wish', '★', 'Nur auf der Wunschliste', ''))
        + `<div class="hits">${hits.map(rowHTML).join('')}</div>`;
      hydrateCovers(out);
      out.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openDetail(b.dataset.open));
    }, 250);
  };
  const ph = $('#ckPhoto', s);
  if (ph) ph.onchange = async e => { const f = e.target.files[0]; if (!f) return; const codes = await detectInImage(await resizeImage(f, 1600, .9)); if (!codes.length) toast('Kein Barcode erkannt'); else { busyCode = ''; checkCode(codes[0]); } e.target.value = ''; };
  if (liveScan) {
    const video = $('video', s);
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false }).then(st => {
      if (stopped) { st.getTracks().forEach(t => t.stop()); return; }
      stream = st; video.srcObject = st; addCamTools(s, st);
      const det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] });
      timer = setInterval(async () => {
        if (video.readyState < 2) return;
        try { for (const c of await det.detect(video)) { if (c.rawValue === lastCode) lastCount++; else { lastCode = c.rawValue; lastCount = 1; } if (lastCount >= 2) checkCode(c.rawValue); } } catch { }
      }, 250);
    }).catch(err => { $('.scanbox', s).outerHTML = `<div class="note warn">Kamera nicht verfügbar (${esc(err.message)}). Tippe den Titel oder die Nummer ein.</div>`; });
  }
}

/* =========================================================
   Statistik
   ========================================================= */
function openStats() {
  const own = live(); const n = own.length;
  const euro = v => (+v || 0).toLocaleString('de-DE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
  const priced = own.filter(i => +i.kaufpreis > 0); const total = priced.reduce((a, i) => a + +i.kaufpreis, 0);
  const lentNow = own.filter(i => i.verliehenAn).length;
  const tile = (v, l) => `<div class="tile"><div class="v">${v}</div><div class="l">${l}</div></div>`;
  const est = own.filter(i => i.wert?.ca); const estSum = est.reduce((a, i) => a + +i.wert.ca, 0);
  const bars = (rows, { color, click } = {}) => { const mx = Math.max(1, ...rows.map(r => r[1])); return `<div class="bars">${rows.map(([l, v, c, key, txt]) => `${click && key ? `<button class="lb" data-go="${key}">${esc(l)}</button>` : `<span class="lb" title="${esc(l)}">${esc(l)}</span>`}<div class="tr" title="${esc(l)}: ${esc(txt || v)}"><div class="fl" style="width:${(v / mx * 100).toFixed(1)}%;background:${c || color || 'var(--accent)'}"></div></div><span class="vl">${esc(txt || v)}</span>`).join('')}</div>`; };
  const top = (arr, k, cnt = 5, split = false) => { const m = new Map(); arr.forEach(i => { const vals = split ? String(i[k] || '').split(',').map(x => x.trim()).filter(Boolean) : [i[k]]; vals.forEach(v => { if (!isEmpty(v)) m.set(v, (m.get(v) || 0) + 1); }); }); return [...m.entries()].sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0]), 'de')).slice(0, cnt); };
  const ofType = t => own.filter(i => i.typ === t);
  const sec = (title, body, sub = '') => body ? `<div class="stsec"><h4>${title}</h4>${sub ? `<p class="sub">${sub}</p>` : ''}${body}</div>` : '';
  // Typen
  const typeRows = TYPE_KEYS.map(t => [TYPES[t].label, ofType(t).length, `var(--c-${t})`, t]);
  const valueRows = TYPE_KEYS.map(t => { const v = ofType(t).reduce((a, i) => a + (+i.kaufpreis || 0), 0); return [TYPES[t].label, v, `var(--c-${t})`, t, euro(v)]; }).filter(r => r[1] > 0);
  // Zuwachs letzte 12 Monate
  const now = new Date(); const months = [...Array(12)].map((_, k) => { const d = new Date(now.getFullYear(), now.getMonth() - 11 + k, 1); return { y: d.getFullYear(), m: d.getMonth(), n: 0 }; });
  own.forEach(i => { const d = new Date(i.createdAt); const mm = months.find(x => x.y === d.getFullYear() && x.m === d.getMonth()); if (mm) mm.n++; });
  const mmax = Math.max(1, ...months.map(x => x.n));
  const MN = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
  const cols = `<div class="cols">${months.map(x => `<div class="c" title="${MN[x.m]} ${x.y}: ${x.n} neu"><span class="n" style="bottom:calc(${x.n / mmax * 100}% + 2px)">${x.n || ''}</span><div class="b" style="height:${x.n / mmax * 100}%"></div></div>`).join('')}</div><div class="colx">${months.map(x => `<span>${MN[x.m].slice(0, 1)}</span>`).join('')}</div>`;
  // Fortschritt
  const prog = [
    ['Bücher gelesen', ofType('buch').filter(i => i.gelesen === 'Gelesen').length, ofType('buch').length, 'buch'],
    ['Filme gesehen', ofType('bluray').filter(i => i.gesehen === 'Ja').length, ofType('bluray').length, 'bluray'],
    ['Games durchgespielt', ofType('game').filter(i => ['Durchgespielt', '100 %'].includes(i.status)).length, ofType('game').length, 'game'],

/* =========================================================
   Automatische Backups im Dropbox-Ordner (monatlich, 12 behalten)
   ========================================================= */
async function listBackups() {
  try { return (await dbxListFolders(P('/backups'))).filter(e => e['.tag'] === 'file' && /^mediathek_\d{4}-\d{2}-\d{2}\.json$/.test(e.name)).sort((a, b) => b.name.localeCompare(a.name)); }
  catch (e) { if (/not_found/.test(e.summary || e.message)) return []; throw e; }
}
async function maybeBackup(force) {
  if (VIEW || !dbxReady()) return;
  if (!force && Date.now() - (meta.backupCheckedAt || 0) < 864e5) return; // höchstens 1× pro Tag prüfen
  meta.backupCheckedAt = Date.now(); await saveMeta();
  const list = await listBackups();
  const last = list[0]?.name.slice(10, 20);
  if (!force && last && Date.now() - new Date(last) < 30 * 864e5) { meta.lastBackup = last; await saveMeta(); return; }
  if (!allLive().length) { if (force) throw new Error('Noch keine Medien vorhanden.'); return; }
  const name = `mediathek_${todayISO()}.json`;
  await dbxUpload(P('/backups/' + name), JSON.stringify({ app: 'mediathek', version: 1, backupAt: Date.now(), shared, items: allLive(), extra: extra.filter(r => !r.deleted) }), { '.tag': 'overwrite' });
  for (const old of list.filter(f => f.name !== name).slice(11)) { try { await dbxRpc('files/delete_v2', { path: old.path_display }); } catch { } }
  meta.lastBackup = todayISO(); await saveMeta();
  return name;
}
async function openBackupRestore() {
  const s = openSheet(`${sheetHead('Aus Backup wiederherstellen')}<div id="brList"><div class="spinner"></div></div>`);
  let list; try { list = await listBackups(); } catch (e) { $('#brList', s).innerHTML = `<div class="note warn">${esc(e.message)}</div>`; return; }
  $('#brList', s).innerHTML = list.length ? `<p class="hint" style="margin-top:0">Stellt die Sammlung genau so her, wie sie am gewählten Tag war. Später Hinzugefügtes wird entfernt – auf allen Geräten.</p><div class="menu">${list.map(f => `<button data-bk="${esc(f.path_display)}"><span class="mi">🗂</span><span><b>${esc(deDate(f.name.slice(10, 20)))}</b><small>${Math.round(f.size / 1024)} KB</small></span></button>`).join('')}</div>` : '<p class="hint">Noch keine Backups vorhanden.</p>';
  s.onclick = async e => {
    const b = e.target.closest('[data-bk]'); if (!b) return;
    if (!confirm(`Sammlung auf den Stand vom ${b.querySelector('b').textContent} zurücksetzen?\n\nTipp: Vorher „Jetzt Backup anlegen“, falls ihr den aktuellen Stand behalten wollt.`)) return;
    try {
      const j = JSON.parse(await (await dbxDownload(b.dataset.bk)).text());
      const now = Date.now(); const keep = new Set(j.items.map(i => i.id));
      const restored = j.items.map(i => Object.assign({}, i, { updatedAt: now }));
      const gone = items.filter(i => !keep.has(i.id) && !i.deleted).map(i => ({ id: i.id, createdAt: i.createdAt, deleted: true, updatedAt: now }));
      const old = items.filter(i => !keep.has(i.id) && i.deleted);
      items = [...restored, ...gone, ...old];
      if (j.shared) { shared = Object.assign({}, j.shared, { updatedAt: now }); await idb.set('shared', shared); }
      await persist(); await closeSheet(); render(); toast('Wiederhergestellt');
    } catch (err) { alert('Wiederherstellen fehlgeschlagen: ' + err.message); }
  };
}

/* =========================================================
   Links ohne Server: Daten werden komprimiert in den Link gepackt.
   Gäste schicken ihre Antwort als Link zurück (z. B. per WhatsApp),
   ein Tipp darauf trägt sie in eurer App ein.
   ========================================================= */
const baseURL = () => location.origin + location.pathname;
async function packObj(o) {
  const json = JSON.stringify(o);
  try {
    if ('CompressionStream' in window) {
      const cs = new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw'));
      const buf = new Uint8Array(await new Response(cs).arrayBuffer()); let bin = ''; for (let i = 0; i < buf.length; i++) bin += String.fromCharCode(buf[i]);
      return 'z' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
  } catch { }
  return 'j' + b64urlStr(json);
}
async function unpackObj(code) {
  const t = code[0], b = code.slice(1);
  if (t === 'j') return JSON.parse(unb64urlStr(b));
  const bin = atob(b.replace(/-/g, '+').replace(/_/g, '/')); const buf = Uint8Array.from(bin, c => c.charCodeAt(0));
  const ds = new Blob([buf]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return JSON.parse(await new Response(ds).text());
}
const ownersTitle = () => [shared.person1, shared.person2].filter(Boolean).join(' & ');

    ${navigator.share ? '<button class="btn" id="soShare" style="height:48px">Mit anderer App senden …</button>' : ''}
    <button class="btn" id="soCopy" style="height:48px">Text & Link kopieren</button></div>
    <details style="margin-top:12px"><summary class="hint">Vorschau der Nachricht</summary><div class="note" style="white-space:pre-wrap;word-break:break-all;margin-top:6px">${esc(full)}</div></details>`, { onClose: onDone });
  $('#soWa', s).onclick = () => setTimeout(() => toast('In WhatsApp den Empfänger wählen und senden'), 300);
  const sh = $('#soShare', s); if (sh) sh.onclick = async () => { try { await navigator.share({ title, text, url }); } catch { } };
  $('#soCopy', s).onclick = async () => { try { await navigator.clipboard.writeText(full); toast('Kopiert'); } catch { prompt('Kopieren:', full); } };

/* ---------- Eingehende Links (Stimme / Anfrage) eintragen ---------- */
async function handleIncoming(kind, code) {
  let d; try { d = await unpackObj(code); } catch { return toast('Der Link ist unvollständig.'); }
  if (kind === 'stimme' && d?.k === 'v' && d.a && Array.isArray(d.p)) {
    const name = String(d.n || 'Gast').trim().slice(0, 40);
    const ex = xLive('vote').find(v => v.id === 'v_' + d.id) || xLive('vote').find(v => v.a === d.a && v.n.toLowerCase() === name.toLowerCase());
    const rec = { id: ex?.id || 'v_' + String(d.id || uid()).slice(0, 30), kind: 'vote', a: String(d.a), n: name, p: d.p.slice(0, 3).map(String), at: d.at || Date.now() };
    await upsertExtra(rec);
    ui.type = 'abend'; saveUi(); render();
    const ab = xLive('abend').find(x => x.id === rec.a);

  } else toast('Unbekannter Link');
}
function pasteIncoming() {

/* ---------- Kamera: Taschenlampe & Zoom ---------- */
function addCamTools(s, stream) {
  const box = $('.scanbox', s); const track = stream.getVideoTracks()[0]; if (!box || !track) return;
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  const tools = document.createElement('div'); tools.className = 'camtools';
  if (caps.torch) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = '🔦'; b.title = 'Taschenlampe'; let on = false;
    b.onclick = async () => { on = !on; try { await track.applyConstraints({ advanced: [{ torch: on }] }); b.classList.toggle('on', on); } catch { on = false; toast('Taschenlampe nicht verfügbar'); } };
    tools.appendChild(b);
  }
  if (caps.zoom && caps.zoom.max >= 2) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = '2×'; b.style.fontSize = '15px'; b.title = 'Zoom'; let z = false;
    b.onclick = async () => { z = !z; try { await track.applyConstraints({ advanced: [{ zoom: z ? Math.min(2, caps.zoom.max) : Math.max(1, caps.zoom.min || 1) }] }); b.classList.toggle('on', z); } catch { } };
    tools.appendChild(b);
  }
  if (tools.children.length) box.appendChild(tools);
}

/* =========================================================
   Aufräum-Assistent
   ========================================================= */
const normDup = t => String(t || '').toLowerCase().replace(/,\s*(der|die|das|the|ein|eine|le|la|les)$/, '').replace(/^(der|die|das|the|ein|eine|a|an)\s+/, '').replace(/\s*[\(\[].*?[\)\]]\s*/g, ' ').replace(/[^a-z0-9äöüß]/g, '');
function findDupGroups() {
  const m = new Map();
  for (const it of live()) {
    const key = it.typ + '|' + normDup(it.titel) + (it.typ === 'game' ? '|' + (it.plattform || '') : '') + (it.typ === 'vinyl' ? '|' + normDup(it.interpret) : '');
    if (!m.has(key)) m.set(key, []); m.get(key).push(it);
  }
  const bc = new Map(); for (const it of live()) if (it.barcode) { if (!bc.has(it.barcode)) bc.set(it.barcode, []); bc.get(it.barcode).push(it); }
  const groups = [...m.entries(), ...[...bc.entries()].map(([k, v]) => ['bc|' + k, v])].filter(([, v]) => v.length > 1);
  const seen = new Set(); const out = [];
  for (const [key, arr] of groups) {
    const sig = arr.map(i => i.id).sort().join(',');
    if (seen.has(sig)) continue; seen.add(sig);
    if (arr.every(i => (i.keinDuplikat || []).includes(sig))) continue;
    out.push({ sig, items: arr.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)) });
  }
  return out;
}
async function mergeItems(keepId, otherIds) {
  const keep = byId(keepId); if (!keep) return;
  const rec = Object.assign({}, keep);
  for (const oid of otherIds) {
    const o = byId(oid); if (!o) continue;
    for (const [k, v] of Object.entries(o)) if (isEmpty(rec[k]) && !['id', 'createdAt', 'updatedAt', 'deleted', 'coverLocal', 'coverSpine', 'coverAspect', 'spineLocal', 'imgAt', 'spineAt', 'keinDuplikat'].includes(k)) rec[k] = v;
    if ((o.verleihHistorie || []).length) rec.verleihHistorie = [...(rec.verleihHistorie || []), ...o.verleihHistorie];
    if (!hasCover(rec) && !rec._coverData && o.coverLocal && !o.coverSpine) { const d = await localImg('cover', o.id); if (d) rec._coverData = d; }
    if (!hasSpine(rec) && !rec._spineData && hasSpine(o)) { const d = await spineURL(o); if (d) { rec._spineData = d; rec._spineAspect = o.coverAspect; } }
    rec.createdAt = Math.min(rec.createdAt || Date.now(), o.createdAt || Date.now());
  }
  const created = rec.createdAt; await upsertItem(rec); const it = byId(keepId) || items.find(i => i.id === keepId); if (it) it.createdAt = created;
  for (const oid of otherIds) await deleteItem(oid);
}

    body.innerHTML = `<div class="rules"><p style="font:800 19px Fraunces,serif;margin-bottom:2px">${esc(it.titel)}</p><p class="hint">${esc(playersText(it))}${it.dauer ? ' · ' + it.dauer + ' Min.' : ''}${it.alterAb ? ' · ab ' + it.alterAb : ''}</p>
      ${r.ziel ? `<h4>🎯 Ziel</h4><p>${esc(r.ziel)}</p>` : ''}${r.aufbau?.length ? `<h4>🧩 Aufbau</h4><ul>${li(r.aufbau)}</ul>` : ''}
      ${r.ablauf?.length ? `<h4>🔄 Ein Zug</h4><ol>${li(r.ablauf)}</ol>` : ''}${r.ende ? `<h4>🏁 Spielende & Sieg</h4><p>${esc(r.ende)}</p>` : ''}
      ${r.tipps?.length ? `<h4>💡 Tipps für Neulinge</h4><ul>${li(r.tipps)}</ul>` : ''}${r.fehler?.length ? `<h4>⚠️ Häufige Regelfehler</h4><ul>${li(r.fehler)}</ul>` : ''}
      <p class="note" style="margin-top:14px;font-size:12px">KI-Zusammenfassung vom ${esc(deDate(r.at))} – im Zweifel gilt die Spielanleitung.${it.youtube ? ' Ein Erklärvideo ist beim Spiel verlinkt.' : ''}</p></div>
      ${linksHTML(it)}${VIEW ? '' : '<button class="btn ghost" id="ruNew" style="width:100%;margin-top:8px">Neu erstellen</button>'}`;

  };

  if (settings.provider === 'barcode' || !aiKey()) { body.innerHTML = `<div class="note">Dafür braucht es eine KI (Claude oder Gemini). Einrichten unter <b>Einstellungen → Foto-Erkennung</b>. Kosten: unter 1 Cent pro Spiel, danach ist die Zusammenfassung gespeichert.</div>${linksHTML(it)}`; return; }
  body.innerHTML = '<div class="spinner"></div><p class="hint" style="text-align:center">Fasse die Regeln zusammen …</p>';
  const known = ['verlag', 'autor', 'jahr', 'spielerMin', 'spielerMax', 'dauer', 'erweiterungVon'].filter(k => !isEmpty(it[k])).map(k => `${k}: ${it[k]}`).join(', ');
  const prompt = `Fasse die Spielregeln des Brettspiels „${it.titel}“ (${known || 'keine weiteren Angaben'}) auf Deutsch so zusammen, dass eine Gruppe in 2 Minuten loslegen kann.${it.erweiterungVon ? ` Es ist eine Erweiterung von „${it.erweiterungVon}“ – beschreibe vor allem, was sich gegenüber dem Grundspiel ändert.` : ''}
Kurz, klar, Alltagssprache, keine Wiederholungen. Wenn du das Spiel nicht sicher kennst, erfinde NICHTS und antworte nur {"unbekannt":true}.
Antworte NUR mit JSON: {"ziel":"1–2 Sätze","aufbau":["max. 4 Punkte"],"ablauf":["max. 6 Schritte eines Zuges"],"ende":"wann endet es, wer gewinnt","tipps":["max. 3"],"fehler":["max. 3 häufige Regelfehler"]}`;
  try {
    const text = await aiCall(prompt, null, 1500);
    const a = text.indexOf('{'), b = text.lastIndexOf('}'); const r = JSON.parse(text.slice(a, b + 1));
    if (r.unbekannt || !r.ziel) { body.innerHTML = `<div class="note warn">Die KI kennt „${esc(it.titel)}“ nicht sicher genug für eine verlässliche Zusammenfassung. Tipp: Ein Regel-Video über „🔍 YT“ im Formular verlinken.</div>${linksHTML(it)}`; return; }
    r.at = todayISO(); const cur = byId(id); cur.regeln = r; cur.updatedAt = Date.now(); await persist(); show(r);
  } catch (e) { body.innerHTML = `<div class="note warn">${esc(e.message)}</div>`; }
}

/* =========================================================
   Was ist die Sammlung wert? (Gebrauchtwert-Schätzung)
   ========================================================= */
const euroS = v => (+v || 0).toLocaleString('de-DE', { style: 'currency', currency: 'EUR', maximumFractionDigits: (+v || 0) < 20 ? 2 : 0 });
async function discogsValue(it) {
  const tok = settings.discogsToken; if (!tok || it.typ !== 'vinyl') return null;
  const H = { headers: { Authorization: 'Discogs token=' + tok } };
  const get = async u => { try { const r = await fetch('https://api.discogs.com/' + u, H); return r.ok ? r.json() : null; } catch { return null; } };
  let q = it.barcode ? `database/search?barcode=${encodeURIComponent(it.barcode)}&type=release` : `database/search?type=release&format=Vinyl&release_title=${encodeURIComponent(it.titel)}${it.interpret ? '&artist=' + encodeURIComponent(it.interpret) : ''}`;
  const sr = await get(q); const rel = sr?.results?.[0]; if (!rel) return null;
  const st = await get(`marketplace/stats/${rel.id}?curr_abbr=EUR`);
  const low = st?.lowest_price?.value; if (!low) return null;
  return { ca: Math.round(low * 1.15 * 2) / 2, min: Math.round(low * 100) / 100, max: Math.round(low * 1.8), q: 'Discogs', hinweis: `${st.num_for_sale || 0} Angebote, ab ${euroS(low)}` };
}
async function aiValues(batch) {
  const list = batch.map(it => ({ id: it.id, art: TYPES[it.typ].single, titel: it.titel, details: subtitle(it), format: it.format || it.ausgabe || it.plattform || it.edition || '', zustand: it.zustandPlatte || it.zustand || '', vollstaendig: it.vollstaendig || it.lieferumfang || '', kaufpreis: it.kaufpreis || '' }));
  const prompt = `Schätze den heutigen GEBRAUCHTWERT in Euro (realistischer Verkaufspreis privat in Deutschland, z. B. Kleinanzeigen/eBay/Medimops), Stand ${new Date().getFullYear()}, für diese Medien einer privaten Sammlung. Berücksichtige Format, Edition und Zustand. Seltene oder gesuchte Ausgaben höher, Massenware niedrig (z. B. Standard-DVDs oft 1–3 €). Bist du dir bei einem Titel unsicher, gib eine breitere Spanne an.
Medien: ${JSON.stringify(list)}
Antworte NUR mit JSON: {"werte":[{"id":"…","ca":Zahl,"min":Zahl,"max":Zahl,"hinweis":"max. 8 Wörter, z. B. gesuchte Erstauflage"}]}`;
  const text = await aiCall(prompt, null, 3000);
  const a = text.indexOf('{'), b = text.lastIndexOf('}'); return JSON.parse(text.slice(a, b + 1)).werte || [];
}
async function estimateValues(list, s) {
  const prog = $('#vaProg', s); let done = 0, stop = false; s.parentElement._onClose = () => stop = true;
  const ai = settings.provider !== 'barcode' && aiKey();
  const now = todayISO();
  // 1) Vinyl mit Discogs (echte Marktpreise)
  for (const it of list.filter(i => i.typ === 'vinyl' && settings.discogsToken)) {
    if (stop) return; prog.textContent = `Discogs: ${it.titel}`;
    const v = await discogsValue(it); if (v) { it.wert = Object.assign(v, { at: now }); it.updatedAt = Date.now(); done++; }
    await sleep(1100); // Discogs erlaubt ~60 Anfragen/Minute
  }
  // 2) Rest per KI in Paketen
  const rest = list.filter(i => !(i.wert?.q === 'Discogs' && i.wert.at === now));
  if (rest.length && !ai) { await persist(); return toast(done ? `${done} Werte von Discogs` : 'Für die Schätzung bitte eine KI einrichten'); }
  for (let i = 0; i < rest.length; i += 20) {
    if (stop) break;
    prog.textContent = `Schätze ${Math.min(i + 20, rest.length)} von ${rest.length} …`;
    try {
      const res = await aiValues(rest.slice(i, i + 20));
      for (const r of res) { const it = byId(String(r.id)); if (it && +r.ca >= 0) { it.wert = { ca: +r.ca, min: +r.min || undefined, max: +r.max || undefined, q: 'KI', hinweis: String(r.hinweis || '').slice(0, 80), at: now }; it.updatedAt = Date.now(); done++; } }
    } catch (e) { toast('Fehler: ' + e.message); break; }
  }
  await persist(); toast(`${done} Werte geschätzt`);
}
function openValue() {
  const own = live(); const est = own.filter(i => i.wert?.ca); const miss = own.filter(i => !i.wert?.ca);
  const sum = est.reduce((a, i) => a + +i.wert.ca, 0), sMin = est.reduce((a, i) => a + (+i.wert.min || +i.wert.ca), 0), sMax = est.reduce((a, i) => a + (+i.wert.max || +i.wert.ca), 0);
  const paid = est.filter(i => +i.kaufpreis > 0); const paidSum = paid.reduce((a, i) => a + +i.kaufpreis, 0), paidVal = paid.reduce((a, i) => a + +i.wert.ca, 0);
  const byType = TYPE_KEYS.map(t => [TYPES[t].label, est.filter(i => i.typ === t).reduce((a, i) => a + +i.wert.ca, 0), `var(--c-${t})`]).filter(r => r[1] > 0);
  const mx = Math.max(1, ...byType.map(r => r[1]));
  const top = [...est].sort((a, b) => b.wert.ca - a.wert.ca).slice(0, 10);
  const gain = paid.map(i => [i, i.wert.ca - i.kaufpreis]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const ai = settings.provider !== 'barcode' && aiKey();
  const cost = settings.provider === 'claude' && /sonnet/.test(settings.claudeModel) ? 'ca. 1 Cent je 20 Medien' : 'unter 0,2 Cent je 20 Medien';
  const s = openSheet(`${sheetHead('Was ist die Sammlung wert?')}
    <div class="tiles"><div class="tile"><div class="v">${est.length ? euroS(sum) : '–'}</div><div class="l">geschätzter Gebrauchtwert${est.length ? ` (Spanne ${euroS(sMin)}–${euroS(sMax)})` : ''}</div></div>
      <div class="tile"><div class="v">${est.length} / ${own.length}</div><div class="l">Medien geschätzt</div></div>
      ${paid.length ? `<div class="tile"><div class="v">${Math.round(paidVal / paidSum * 100)} %</div><div class="l">vom Kaufpreis noch wert (${paid.length} Medien mit Preis)</div></div>` : ''}</div>
    <div class="stsec"><p style="margin:0 0 10px;font-size:14px">Die KI schätzt realistische Privat-Verkaufspreise in Deutschland, bei Vinyl mit Discogs-Token echte Marktpreise. <b>Nur Richtwerte</b> – für Versicherung oder Verkauf im Zweifel nachprüfen.</p>
      ${ai || settings.discogsToken ? `<div class="chkacts">${miss.length ? `<button class="btn primary" id="vaMiss">Fehlende schätzen (${miss.length})</button>` : ''}<button class="btn" id="vaAll">Alle neu schätzen (${own.length})</button></div><p class="hint" style="margin:6px 0 0">Kosten: ${cost}. <span id="vaProg"></span></p>`
        : '<div class="note">Bitte zuerst unter Einstellungen → Foto-Erkennung eine KI einrichten (oder für Vinyl einen Discogs-Token).</div>'}</div>
    ${byType.length ? `<div class="stsec"><h4>Nach Medienart</h4><div class="bars">${byType.map(([l, v, c]) => `<span class="lb">${esc(l)}</span><div class="tr" title="${esc(l)}: ${euroS(v)}"><div class="fl" style="width:${(v / mx * 100).toFixed(1)}%;background:${c}"></div></div><span class="vl">${euroS(v)}</span>`).join('')}</div></div>` : ''}
    ${top.length ? `<div class="stsec"><h4>Die wertvollsten 10</h4>${top.map(i => `<div class="valrow"><span><b>${esc(i.titel)}</b> <span class="hint">${esc(TYPES[i.typ].single)}</span></span><b>${euroS(i.wert.ca)}</b>${i.wert.hinweis ? `<span class="hint">${esc(i.wert.hinweis)} · ${esc(i.wert.q)}</span>` : ''}</div>`).join('')}</div>` : ''}
    ${gain.length ? `<div class="stsec"><h4>Mehr wert als bezahlt</h4>${gain.map(([i, g]) => `<div class="valrow"><span>${esc(i.titel)} <span class="hint">gekauft für ${euroS(i.kaufpreis)}</span></span><b style="color:var(--ok)">+${euroS(g)}</b></div>`).join('')}</div>` : ''}`);
  const run = async list => { $$('.chkacts .btn', s).forEach(b => b.disabled = true); await estimateValues(list, s); await closeSheet(); openValue(); };
  const m = $('#vaMiss', s); if (m) m.onclick = () => run(miss);
  const a = $('#vaAll', s); if (a) a.onclick = () => { if (confirm(`Alle ${own.length} Medien neu schätzen? (${cost})`)) run(own); };
}

(async function init() {
  const sm = location.hash.match(/^#sammlung=([A-Za-z0-9_-]+)/);

  const vm = location.hash.match(/^#abend=([A-Za-z0-9_-]+)/);
  if (vm) return initVote(vm[1]);
  const incoming = location.hash.match(/^#(stimme|anfrage)=([A-Za-z0-9_-]+)/);
  items = (await idb.get('items')) || [];
  meta = Object.assign(meta, (await idb.get('meta')) || {});
  shared = Object.assign(shared, (await idb.get('shared')) || {});
  extra = (await idb.get('extra')) || [];
  if (new URLSearchParams(location.search).has('demo') && !items.length) await loadDemo();
  const aktion = new URLSearchParams(location.search).get('aktion');
  history.replaceState({ sheet: 0 }, '', incoming || aktion ? location.pathname : undefined);
  if (aktion === 'wunsch') { ui.type = 'wunsch'; ui.sort = 'prio'; }
  render(); syncLabel();
  scheduleSync(500);
  if (aktion === 'check') openCheck(); else if (aktion === 'scan') openScanner(); else if (aktion === 'neu') openAddMenu();
  if (incoming) handleIncoming(incoming[1], incoming[2]);
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => { });
})();
